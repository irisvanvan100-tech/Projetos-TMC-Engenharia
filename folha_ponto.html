<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folha de Ponto</title>
<link rel="stylesheet" href="estilo.css">
<style>
:root{--ok:#cfe0c3;--meio:#f3e2a9;--falta:#efc2b8;--dom:#ebe4d3}
button{cursor:pointer;border:1px solid var(--oliva);background:var(--oliva);color:#fff;border-radius:6px;padding:8px 14px}
button.sec{background:transparent;color:var(--oliva)}
button.perigo{background:transparent;color:#a3392a;border-color:#a3392a}
input,select{border:1px solid var(--borda);border-radius:6px;padding:8px;background:#fff;width:100%}
label{display:block;margin:10px 0 4px;font-weight:600}
.erro{color:#a3392a;margin:10px 0 0;min-height:1em}
.barra{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px;align-items:center}
.barra select{max-width:340px}
main{padding:0 20px 40px}
.info{background:#fff;border:1px solid var(--borda);border-left:6px solid var(--bege);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.info strong{font-size:17px}
.secao{margin-bottom:24px}
.secao h2{margin:0 0 8px;font-size:17px;display:flex;gap:12px;align-items:center}
.rolagem{overflow-x:auto;background:#fff;border:1px solid var(--borda);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{border:1px solid var(--borda);padding:4px;text-align:center;white-space:nowrap}
thead th{background:var(--bege);font-weight:600;font-size:12px}
th.dom{background:#d6b999}
td.dom{background:var(--dom)}
td:first-child,th:first-child{position:sticky;left:0;background:#fff;text-align:left;min-width:170px;z-index:1}
thead th:first-child{background:var(--bege)}
td input{text-align:center;padding:5px 2px;border:0;background:transparent;width:46px}
td.nome input{text-align:left;width:150px;padding:5px}
td.v1{background:var(--ok)}td.v05{background:var(--meio)}td.v0{background:var(--falta)}
td.valor input{width:84px}
.tot{font-weight:700}
.receber{font-weight:700;color:#3c5a2e}
tfoot td{background:var(--fundo);font-weight:700}
.resumo{display:flex;gap:12px;flex-wrap:wrap}
.resumo div{flex:1;min-width:200px;background:#fff;border:1px solid var(--borda);border-radius:8px;padding:12px 16px}
.resumo b{display:block;font-size:20px;color:#3c5a2e}
.vazio{padding:28px;text-align:center}
dialog{border:1px solid var(--borda);border-radius:10px;padding:22px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(47,53,43,.45)}
dialog h3{margin:0 0 6px}
.acoes{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.chk{display:flex;gap:8px;align-items:center;font-weight:400}.chk input{width:auto}
.cfg{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.cfg label{margin:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.cfg input{width:150px}
.nota{margin:8px 0 0;font-size:13px;opacity:.85}
@media(max-width:600px){.barra select{max-width:none}}
/* abas e histórico de funcionários */
.abas{display:flex;gap:6px;padding:14px 20px 0}
.abas button{flex:0 1 auto;background:#fff;color:var(--oliva)}
.abas button[aria-pressed="true"]{background:var(--oliva);color:#fff;font-weight:600}
.hfiltros{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px 0;align-items:center}
.hfiltros input{max-width:360px}
.hfiltros select{width:auto}
#telaHist{padding:0 20px 40px}
.hres{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}
.hres div{flex:1;min-width:160px;background:#fff;border:1px solid var(--borda);border-radius:8px;padding:10px 14px}
.hres b{display:block;font-size:20px;color:#3c5a2e}
.func{background:#fff;border:1px solid var(--borda);border-radius:8px;margin-bottom:8px}
.func>summary{list-style:none;display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;flex-wrap:wrap}
.func>summary::-webkit-details-marker{display:none}
.func>summary .n{flex:1;min-width:180px}
.func>summary .n b{display:block}
.func>summary .n small,.func>summary .t small{color:#6b7163;font-size:12px}
.func>summary .t{text-align:right}
.func>summary .t b{display:block;color:#3c5a2e}
.func .det{padding:0 14px 12px;overflow-x:auto}
.func .det table{min-width:520px}
.func .det td,.func .det th{white-space:normal}
.func .det td:first-child,.func .det th:first-child{position:static}
.semcpf{border-left:5px solid #e8a33d}
.tag{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;background:#fbe7cf;color:#8a4b0f}
.achou{background:#e3f0e1;border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13px}
.nomes{display:flex;gap:10px}.nomes>div{flex:1}
</style>
</head>
<body>
<p id="carregando">Carregando…</p>
<div id="sistema" class="oculto">
<header class="topo">
  <img class="marca" src="logo.jpg" alt="TMC Engenharia">
  <h1>Folha de Ponto</h1>
  <span class="quem" id="quem"></span>
  <a class="btnlink" id="linkInicio" href="index.html" hidden>Início</a>
  <button id="btnSair" type="button">Sair</button>
</header>
  <div class="abas"><button type="button" id="abaFolha" aria-pressed="true">🗓 Folha da quinzena</button><button type="button" id="abaHist" aria-pressed="false">👷 Histórico de funcionários</button></div>
  <div id="telaFolha">
  <div class="barra">
    <select id="selQuinzena" aria-label="Quinzena"></select>
    <button id="btnNova" class="editor">Nova quinzena</button>
    <button id="btnEditarQ" class="sec editor">Editar quinzena</button>
    <button id="btnExcluirQ" class="perigo editor">Excluir quinzena</button>
    <button id="btnPDF">Gerar PDF</button>
  </div>
  <main id="conteudo"></main>
  </div>
  <div id="telaHist" hidden>
    <div class="hfiltros" style="padding:16px 0 0"><input id="hBusca" placeholder="🔍 Buscar por CPF ou nome" autocomplete="off" aria-label="Buscar por CPF ou nome"><select id="hAno" aria-label="Ano"></select></div>
    <div class="hres" id="hRes"></div>
    <div id="hLista"></div>
  </div>
</div>

<dialog id="dlgQ">
  <h3 id="dlgQTitulo">Nova quinzena</h3>
  <label for="qObra">Obra</label><input id="qObra" placeholder="Ex.: Jabuti Garden Fase 2">
  <label for="qIni">Primeiro dia</label><input id="qIni" type="date">
  <label for="qFim">Último dia</label><input id="qFim" type="date">
  <label class="chk" id="boxCopiar"><input id="qCopiar" type="checkbox" checked> Copiar equipe da quinzena anterior</label>
  <p class="erro" id="erroQ"></p>
  <div class="acoes"><button class="sec" data-fechar="dlgQ">Cancelar</button><button id="btnSalvarQ">Salvar</button></div>
</dialog>

<dialog id="dlgF">
  <h3 id="dlgFTitulo">Adicionar funcionário</h3>
  <label for="fCpf">CPF</label><input id="fCpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off">
  <div id="fAchou" class="achou" hidden></div>
  <div class="nomes"><div><label for="fNome1">Primeiro nome</label><input id="fNome1" autocapitalize="words"></div>
    <div><label for="fNome2">Segundo nome</label><input id="fNome2" autocapitalize="words"></div></div>
  <label for="fValor" id="lbValor">Valor da diária (R$)</label><input id="fValor" type="number" min="0" step="0.01">
  <p class="erro" id="erroF"></p>
  <div class="acoes"><button class="sec" data-fechar="dlgF">Cancelar</button><button id="btnSalvarF">Adicionar</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="comum.js"></script>
<script>
// Camada de dados (Supabase). A tela só conversa com o banco por este objeto.
const DB = {
  quinzenas: () => sb.from('quinzenas').select('*').order('data_inicio', { ascending: false }).then(ok),
  criarQuinzena: q => sb.from('quinzenas').insert(q).select().single().then(ok),
  editarQuinzena: (id, q) => sb.from('quinzenas').update(q).eq('id', id).then(ok),
  excluirQuinzena: id => sb.from('quinzenas').delete().eq('id', id).then(ok),
  funcionarios: qid => sb.from('funcionarios_quinzena').select('*').eq('quinzena_id', qid).order('criado_em').order('nome').then(ok),
  addFuncionarios: f => sb.from('funcionarios_quinzena').insert(f).select().then(ok),
  editarFuncionario: (id, f) => sb.from('funcionarios_quinzena').update(f).eq('id', id).then(ok),
  excluirFuncionario: id => sb.from('funcionarios_quinzena').delete().eq('id', id).then(ok),
  cadastro: () => todos(() => sb.from('funcionarios').select('*').order('primeiro_nome')),
  porCpf: cpf => sb.from('funcionarios').select('*').eq('cpf', cpf).maybeSingle().then(ok),
  novoCadastro: f => sb.from('funcionarios').insert(f).select().single().then(ok),
  editarCadastro: (id, f) => sb.from('funcionarios').update(f).eq('id', id).then(ok),
  todasLinhas: () => todos(() => sb.from('funcionarios_quinzena').select('id,quinzena_id,funcionario_id,nome,funcao,valor_diaria')),
  todosPontos: () => todos(() => sb.from('pontos').select('funcionario_id,valor')),
  ligarAntigos: (nome, fid) => sb.from('funcionarios_quinzena').update({ funcionario_id: fid }).is('funcionario_id', null).eq('nome', nome).then(ok),
  pontos: ids => ids.length ? sb.from('pontos').select('*').in('funcionario_id', ids).then(ok) : Promise.resolve([]),
  salvarPonto: (fid, data, valor) => valor === null
    ? sb.from('pontos').delete().eq('funcionario_id', fid).eq('data', data).then(ok)
    : sb.from('pontos').upsert({ funcionario_id: fid, data, valor }, { onConflict: 'funcionario_id,data' }).then(ok)
};

// Interface e regras da folha de ponto
const SEM = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SAB'];
const diaSemana = d => SEM[new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8)).getDay()];
const totalFunc = (id, pontos) => Object.keys(pontos).filter(k => k.startsWith(id + '|')).reduce((s, k) => s + Number(pontos[k]), 0);

let perfil, quinzenas = [], atual = null, funcs = [], pontos = {}, dias = [], editor = false, modoQ = 'nova', funcaoNova = 'servente';

function listaDias(ini, fim) {
  const r = [], d = new Date(+ini.slice(0, 4), +ini.slice(5, 7) - 1, +ini.slice(8));
  const f = new Date(+fim.slice(0, 4), +fim.slice(5, 7) - 1, +fim.slice(8));
  while (d <= f && r.length < 32) { r.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0')); d.setDate(d.getDate() + 1); }
  return r;
}

async function iniciar() {
  ({ perfil, editor } = await TMC.iniciarPagina('folha'));
  TMC.mostrarPagina();
  await carregarQuinzenas();
}

async function carregarQuinzenas(selecionar) {
  quinzenas = await DB.quinzenas();
  const sel = $('selQuinzena');
  sel.innerHTML = quinzenas.map(q => `<option value="${q.id}">${esc(q.obra)} — ${fmtData(q.data_inicio)} a ${fmtData(q.data_fim)}</option>`).join('');
  if (!quinzenas.length) {
    atual = null;
    ['btnEditarQ', 'btnExcluirQ', 'btnPDF'].forEach(s => $(s).classList.add('oculto'));
    $('conteudo').innerHTML = `<div class="vazio">Nenhuma quinzena cadastrada.${editor ? ' Clique em “Nova quinzena” para começar.' : ''}</div>`;
    return;
  }
  $('btnPDF').classList.remove('oculto');
  ['btnEditarQ', 'btnExcluirQ'].forEach(s => $(s).classList.toggle('oculto', !editor));
  sel.value = selecionar || (atual && quinzenas.some(q => q.id === atual.id) ? atual.id : quinzenas[0].id);
  await abrirQuinzena(sel.value);
}

async function abrirQuinzena(id) {
  atual = quinzenas.find(q => q.id === id);
  dias = listaDias(atual.data_inicio, atual.data_fim);
  funcs = await DB.funcionarios(id);
  pontos = {};
  (await DB.pontos(funcs.map(f => f.id))).forEach(p => pontos[p.funcionario_id + '|' + p.data] = p.valor);
  desenhar();
}

function tabela(funcao, titulo) {
  const lista = funcs.filter(f => f.funcao === funcao);
  const cab = dias.map(d => `<th class="${diaSemana(d) === 'DOM' ? 'dom' : ''}">${diaSemana(d)}<br>${d.slice(8)}/${d.slice(5, 7)}</th>`).join('');
  const linhas = lista.map(f => {
    const cel = dias.map(d => {
      const v = pontos[f.id + '|' + d], cls = v == null ? '' : v == 1 ? 'v1' : v == 0.5 ? 'v05' : 'v0';
      const txt = v == null ? '' : String(v).replace('.', ',');
      return `<td class="${cls} ${diaSemana(d) === 'DOM' ? 'dom' : ''}" data-f="${f.id}" data-d="${d}">${editor ? `<input value="${txt}" inputmode="decimal" aria-label="${esc(f.nome)} ${d}">` : txt}</td>`;
    }).join('');
    const t = totalFunc(f.id, pontos);
    return `<tr data-f="${f.id}"><td class="nome">${editor ? `<input value="${esc(f.nome)}" data-campo="nome">` : esc(f.nome)}</td>${cel}
      <td class="tot">${String(t).replace('.', ',')}</td>
      <td class="valor">${editor ? `<input type="number" min="0" step="0.01" value="${f.valor_diaria}" data-campo="valor">` : brl(f.valor_diaria)}</td>
      <td class="receber">${brl(t * f.valor_diaria)}</td>
      ${editor ? `<td><button class="perigo" data-del="${f.id}" title="Excluir funcionário">Excluir</button></td>` : ''}</tr>`;
  }).join('') || `<tr><td colspan="${dias.length + 5}" class="vazio">Nenhum funcionário nesta função.</td></tr>`;
  const soma = lista.reduce((s, f) => s + totalFunc(f.id, pontos) * f.valor_diaria, 0);
  return `<section class="secao"><h2>${titulo} ${editor ? `<button data-add="${funcao}">Adicionar funcionário</button>` : ''}</h2>
    <div class="rolagem"><table><thead><tr><th>Nome</th>${cab}<th>TOTAL</th><th>VALOR DIÁRIA</th><th>A RECEBER</th>${editor ? '<th></th>' : ''}</tr></thead>
    <tbody>${linhas}</tbody><tfoot><tr><td colspan="${dias.length + 3}" style="text-align:right">Total ${titulo.toLowerCase()}</td><td>${brl(soma)}</td>${editor ? '<td></td>' : ''}</tr></tfoot></table></div></section>`;
}

// Alimentação: almoço e pães conforme os funcionários presentes em cada dia
function refeicoes() {
  const c = { pa: atual.preco_almoco ?? 10, pp: atual.preco_pao ?? 0.7, ppa: atual.paes_por_almoco ?? 2 };
  const aj = atual.ajuste_refeicoes || {};
  const linhas = dias.map(d => {
    const pres = f => funcs.filter(x => x.funcao === f && Number(pontos[x.id + '|' + d] || 0) > 0).length;
    const s = pres('servente'), p = pres('pedreiro'), auto = s + p;
    const alm = aj[d] ?? auto, paes = alm * c.ppa;
    return { d, s, p, auto, alm, paes, custo: alm * c.pa + paes * c.pp, ajustado: aj[d] != null };
  });
  const soma = k => linhas.reduce((t, l) => t + l[k], 0);
  return { c, linhas, s: soma('s'), p: soma('p'), alm: soma('alm'), paes: soma('paes'), custo: soma('custo') };
}

function redesenhar() {
  const y = window.scrollY, rol = [...document.querySelectorAll('.rolagem')].map(r => r.scrollLeft);
  desenhar(); window.scrollTo(0, y); document.querySelectorAll('.rolagem').forEach((r, i) => r.scrollLeft = rol[i]);
}

function secaoRefeicoes() {
  const r = refeicoes(), c = r.c;
  const campo = (k, rot, v, step) => `<label>${rot}${editor ? `<input type="number" min="0" step="${step}" value="${v}" data-cfg="${k}">` : `<b>${k === 'paes_por_almoco' ? v : brl(v)}</b>`}</label>`;
  const dom = d => diaSemana(d) === 'DOM' ? 'dom' : '';
  const cab = dias.map(d => `<th class="${dom(d)}">${diaSemana(d)}<br>${d.slice(8)}/${d.slice(5, 7)}</th>`).join('');
  const linha = (rot, fn, tot) => `<tr><td>${rot}</td>${r.linhas.map(l => `<td class="${dom(l.d)}">${fn(l)}</td>`).join('')}<td class="tot">${tot}</td></tr>`;
  const almoco = r.linhas.map(l => `<td class="${l.ajustado ? 'v05' : dom(l.d)}">${editor ? `<input value="${l.alm}" inputmode="numeric" data-aj="${l.d}" aria-label="Almoços ${l.d}">` : l.alm}</td>`).join('');
  return `<section class="secao"><h2>Alimentação (almoço e pães)</h2>
    <div class="cfg">${campo('preco_almoco', 'Preço do almoço (R$)', c.pa, '0.01')}${campo('preco_pao', 'Preço do pão (R$)', c.pp, '0.01')}${campo('paes_por_almoco', 'Pães por almoço', c.ppa, '1')}</div>
    <div class="rolagem"><table><thead><tr><th>Alimentação</th>${cab}<th>TOTAL</th></tr></thead><tbody>
      ${linha('Serventes presentes', l => l.s, r.s)}
      ${linha('Pedreiros presentes', l => l.p, r.p)}
      <tr><td>Almoços</td>${almoco}<td class="tot">${r.alm}</td></tr>
      ${linha('Pães', l => l.paes, r.paes)}
      ${linha('Custo do dia', l => brl(l.custo), brl(r.custo))}
    </tbody></table></div>
    ${editor ? '<p class="nota">Os almoços são contados automaticamente pelos funcionários presentes no dia (1 ou 0,5). Para mudar um dia, digite outra quantidade (a célula fica amarela); apague para voltar ao automático.</p>' : ''}</section>`;
}

function desenhar() {
  const tot = f => funcs.filter(x => x.funcao === f).reduce((s, x) => s + totalFunc(x.id, pontos) * x.valor_diaria, 0);
  $('conteudo').innerHTML = `<div class="info"><strong>${esc(atual.obra)}</strong><br>Quinzena de ${fmtData(atual.data_inicio)} a ${fmtData(atual.data_fim)}${editor ? '<br>Use 1 para presença, 0 para ausência e 0,5 para meia diária.' : ''}</div>
    ${tabela('servente', 'Serventes')}${tabela('pedreiro', 'Pedreiros')}${secaoRefeicoes()}
    <div class="resumo"><div>Serventes<b>${brl(tot('servente'))}</b></div><div>Pedreiros<b>${brl(tot('pedreiro'))}</b></div><div>Alimentação<b>${brl(refeicoes().custo)}</b></div><div>Total geral (mão de obra + alimentação)<b>${brl(tot('servente') + tot('pedreiro') + refeicoes().custo)}</b></div></div>`;
}

// Lançamento de presença: 1, 0 ou 0,5
async function lancar(input) {
  const td = input.closest('td'), fid = td.dataset.f, d = td.dataset.d, bruto = input.value.trim().replace(',', '.');
  const antigo = pontos[fid + '|' + d];
  const v = bruto === '' ? null : Number(bruto);
  if (v !== null && ![0, 0.5, 1].includes(v)) { input.value = antigo == null ? '' : String(antigo).replace('.', ','); alert('Use apenas 1, 0 ou 0,5.'); return; }
  try {
    await DB.salvarPonto(fid, d, v);
    if (v === null) delete pontos[fid + '|' + d]; else pontos[fid + '|' + d] = v;
    redesenhar();
  } catch (e) { alert('Não foi possível salvar: ' + msg(e)); }
}

function abrirQ(modo) {
  modoQ = modo; $('erroQ').textContent = '';
  $('dlgQTitulo').textContent = modo === 'nova' ? 'Nova quinzena' : 'Editar quinzena';
  $('boxCopiar').classList.toggle('oculto', modo !== 'nova' || !quinzenas.length);
  $('qObra').value = atual ? atual.obra : '';
  $('qIni').value = modo === 'editar' ? atual.data_inicio : '';
  $('qFim').value = modo === 'editar' ? atual.data_fim : '';
  $('dlgQ').showModal();
}

async function salvarQ() {
  const q = { obra: $('qObra').value.trim(), data_inicio: $('qIni').value, data_fim: $('qFim').value };
  if (!q.obra || !q.data_inicio || !q.data_fim) { $('erroQ').textContent = 'Preencha a obra e as duas datas.'; return; }
  if (q.data_fim < q.data_inicio) { $('erroQ').textContent = 'O último dia deve ser depois do primeiro.'; return; }
  if (listaDias(q.data_inicio, q.data_fim).length > 31) { $('erroQ').textContent = 'O período pode ter no máximo 31 dias.'; return; }
  try {
    let id;
    if (modoQ === 'editar') { await DB.editarQuinzena(atual.id, q); id = atual.id; }
    else {
      if ($('qCopiar').checked && atual) Object.assign(q, { preco_almoco: atual.preco_almoco ?? 10, preco_pao: atual.preco_pao ?? 0.7, paes_por_almoco: atual.paes_por_almoco ?? 2 });
      const nova = await DB.criarQuinzena(q); id = nova.id;
      if ($('qCopiar').checked && atual) {
        const base = await DB.funcionarios(atual.id);
        if (base.length) await DB.addFuncionarios(base.map(f => ({ quinzena_id: id, nome: f.nome, funcao: f.funcao, valor_diaria: f.valor_diaria, funcionario_id: f.funcionario_id })));
      }
    }
    $('dlgQ').close(); await carregarQuinzenas(id);
  } catch (e) { $('erroQ').textContent = msg(e); }
}

// ===== FUNCIONÁRIO: CPF primeiro; se já trabalhou com a TMC, os dados vêm do cadastro =====
let achado = null, modoF = 'quinzena', antigo = null;   // modoF: 'quinzena' (adicionar) | 'completar' (antigo sem CPF) | 'editar' (cadastro)
const nomeDe = c => `${c.primeiro_nome} ${c.segundo_nome}`;
const capitaliza = t => t.trim().toLowerCase().replace(/(^|\s)\S/g, x => x.toUpperCase());
function abrirF(modo, titulo, dados = {}) {
  modoF = modo; achado = dados.cadastro || null; antigo = dados.antigo || null;
  $('dlgFTitulo').textContent = titulo; $('erroF').textContent = ''; $('fAchou').hidden = true;
  $('fCpf').value = achado ? mascaraCpf(achado.cpf) : ''; $('fCpf').disabled = false;
  const [n1, ...n2] = (dados.nome || '').trim().split(/\s+/);
  $('fNome1').value = achado ? achado.primeiro_nome : n1 || ''; $('fNome2').value = achado ? achado.segundo_nome : n2.join(' ');
  $('fValor').value = dados.valor ?? ''; $('fValor').hidden = $('lbValor').hidden = modo !== 'quinzena';
  $('btnSalvarF').textContent = modo === 'quinzena' ? 'Adicionar' : 'Salvar';
  $('dlgF').showModal(); (modo === 'editar' ? $('fNome1') : $('fCpf')).focus();
}
$('fCpf').oninput = async () => {
  const c = $('fCpf'); c.value = mascaraCpf(c.value); const cpf = soDig(c.value);
  if (modoF === 'editar' || cpf.length < 11) { if (modoF !== 'editar') { achado = null; $('fAchou').hidden = true; } return; }
  if (!cpfValido(cpf)) { $('erroF').textContent = 'CPF inválido: confira os números.'; return; }
  $('erroF').textContent = '';
  try {
    achado = await DB.porCpf(cpf);
    if (!achado) { $('fAchou').hidden = false; $('fAchou').textContent = 'CPF novo: preencha o nome para cadastrar.'; return; }
    $('fNome1').value = achado.primeiro_nome; $('fNome2').value = achado.segundo_nome;
    if (modoF === 'quinzena' && !$('fValor').value) $('fValor').value = achado.valor_diaria;
    $('fAchou').hidden = false; $('fAchou').innerHTML = `✓ <b>${esc(nomeDe(achado))}</b> já está no cadastro. Os dados foram preenchidos.`;
  } catch (e) { $('erroF').textContent = msg(e); }
};
async function salvarF() {
  const cpf = soDig($('fCpf').value), n1 = capitaliza($('fNome1').value), n2 = capitaliza($('fNome2').value), valor = parseFloat($('fValor').value);
  if (!cpfValido(cpf)) return $('erroF').textContent = 'Informe um CPF válido.';
  if (!n1 || !n2) return $('erroF').textContent = 'Informe o primeiro e o segundo nome.';
  if (modoF === 'quinzena' && (isNaN(valor) || valor < 0)) return $('erroF').textContent = 'Informe o valor da diária.';
  const b = $('btnSalvarF'); b.disabled = true;
  try {
    if (modoF === 'editar') {
      const outro = cpf !== achado.cpf && await DB.porCpf(cpf);
      if (outro) throw new Error('Esse CPF já está no cadastro de ' + nomeDe(outro) + '.');
      await DB.editarCadastro(achado.id, { primeiro_nome: n1, segundo_nome: n2, cpf });
    } else {
      // reaproveita o cadastro se o CPF já existe; senão cria
      let cad = achado && achado.cpf === cpf ? achado : await DB.porCpf(cpf);
      const funcao = modoF === 'quinzena' ? funcaoNova : antigo.funcao;
      if (!cad) cad = await DB.novoCadastro({ primeiro_nome: n1, segundo_nome: n2, cpf, funcao, valor_diaria: modoF === 'quinzena' ? valor : antigo.valor });
      else if (modoF === 'quinzena') await DB.editarCadastro(cad.id, { primeiro_nome: n1, segundo_nome: n2, valor_diaria: valor, funcao });
      if (modoF === 'quinzena') {
        if (funcs.some(f => f.funcionario_id === cad.id)) throw new Error(nomeDe(cad) + ' já está nesta quinzena.');
        await DB.addFuncionarios([{ quinzena_id: atual.id, nome: `${n1} ${n2}`, funcao: funcaoNova, valor_diaria: valor, funcionario_id: cad.id }]);
      } else await DB.ligarAntigos(antigo.nome, cad.id);   // liga todas as quinzenas antigas com esse nome
    }
    $('dlgF').close();
    if (modoF === 'quinzena') await abrirQuinzena(atual.id); else await carregarHist(true);
  } catch (e) { $('erroF').textContent = msg(e); }
  b.disabled = false;
}

// ===== HISTÓRICO DE FUNCIONÁRIOS =====
let H = null;   // dados do histórico (carregados ao abrir a aba)
async function carregarHist(forcar) {
  if (H && !forcar) return desenharHist();
  $('hLista').innerHTML = '<p class="vazio">Carregando…</p>';
  try {
    const [cad, linhas, pts] = await Promise.all([DB.cadastro(), DB.todasLinhas(), DB.todosPontos()]);
    const dias = {}; pts.forEach(p => dias[p.funcionario_id] = (dias[p.funcionario_id] || 0) + +p.valor);
    const qz = Object.fromEntries(quinzenas.map(q => [q.id, q]));
    H = { cad, linhas: linhas.filter(l => qz[l.quinzena_id]).map(l => ({ ...l, q: qz[l.quinzena_id], dias: dias[l.id] || 0, valor: (dias[l.id] || 0) * l.valor_diaria })) };
    const anos = [...new Set(H.linhas.map(l => l.q.data_inicio.slice(0, 4)))].sort().reverse(), atualAno = String(new Date().getFullYear());
    if (!anos.includes(atualAno)) anos.unshift(atualAno);
    $('hAno').innerHTML = anos.map(a => `<option>${a}</option>`).join('') + '<option value="">Todos os anos</option>';
    desenharHist();
  } catch (e) { $('hLista').innerHTML = `<p class="erro">Não foi possível carregar: ${esc(msg(e))}</p>`; }
}
const cpfVisivel = cpf => editor ? mascaraCpf(cpf) : '***.' + mascaraCpf(cpf).slice(4, 11) + '-**';   // quem só vê não vê o CPF inteiro
function desenharHist() {
  const ano = $('hAno').value, busca = $('hBusca').value.trim().toLowerCase(), dig = soDig(busca);
  const doAno = H.linhas.filter(l => !ano || l.q.data_inicio.startsWith(ano)).sort((a, b) => b.q.data_inicio.localeCompare(a.q.data_inicio));
  const grupos = new Map();   // cadastro (ou nome, se ainda sem CPF) -> linhas
  doAno.forEach(l => { const k = l.funcionario_id || 'nome:' + l.nome.trim().toLowerCase(); (grupos.get(k) || grupos.set(k, []).get(k)).push(l); });
  const pessoas = [...grupos].map(([k, ls]) => ({ k, cad: H.cad.find(c => c.id === k), nome: ls[0].nome, funcao: ls[0].funcao, ls, dias: ls.reduce((a, l) => a + l.dias, 0), total: ls.reduce((a, l) => a + l.valor, 0) }));
  // quem está no cadastro mas não trabalhou no ano também aparece na busca por CPF/nome
  if (busca) H.cad.filter(c => !grupos.has(c.id)).forEach(c => pessoas.push({ k: c.id, cad: c, nome: nomeDe(c), funcao: c.funcao, ls: [], dias: 0, total: 0 }));
  const casa = p => !busca || (dig.length >= 3 && p.cad && p.cad.cpf.includes(dig)) || semAcento(p.cad ? nomeDe(p.cad) : p.nome).toLowerCase().includes(semAcento(busca));
  const lista = pessoas.filter(casa).sort((a, b) => b.total - a.total || a.nome.localeCompare(b.nome));
  const comCpf = lista.filter(p => p.cad), semCpf = lista.filter(p => !p.cad);
  $('hRes').innerHTML = `<div>Funcionários${ano ? ' em ' + ano : ''}<b>${lista.filter(p => p.ls.length).length}</b></div><div>Diárias pagas<b>${num(lista.reduce((a, p) => a + p.dias, 0))}</b></div><div>Total pago (mão de obra)<b>${brl(lista.reduce((a, p) => a + p.total, 0))}</b></div>`;
  const cartao = p => `<details class="func ${p.cad ? '' : 'semcpf'}"><summary><div class="n"><b>${esc(p.cad ? nomeDe(p.cad) : p.nome)}</b>
      <small>${p.cad ? 'CPF ' + cpfVisivel(p.cad.cpf) : '<span class="tag">sem CPF</span>'} • ${p.funcao === 'pedreiro' ? 'Pedreiro' : 'Servente'} • ${p.ls.length} ${p.ls.length === 1 ? 'quinzena' : 'quinzenas'}${p.ls[0] ? ' • última: ' + esc(p.ls[0].q.obra) + ' ' + fmtData(p.ls[0].q.data_inicio).slice(0, 5) : ''}</small></div>
      <div class="t"><b>${brl(p.total)}</b><small>${num(p.dias)} diárias</small></div>
      ${editor ? (p.cad ? `<button type="button" class="sec" data-hedit="${p.k}">Editar</button>` : `<button type="button" data-hcpf="${esc(p.k)}">Completar CPF</button>`) : ''}</summary>
    <div class="det">${p.ls.length ? `<table><thead><tr><th>Quinzena</th><th>Obra</th><th>Função</th><th>Diárias</th><th>Diária</th><th>Recebeu</th></tr></thead><tbody>${p.ls.map(l => `<tr><td>${fmtData(l.q.data_inicio)} a ${fmtData(l.q.data_fim)}</td><td>${esc(l.q.obra)}</td><td>${l.funcao === 'pedreiro' ? 'Pedreiro' : 'Servente'}</td><td>${num(l.dias)}</td><td>${brl(l.valor_diaria)}</td><td>${brl(l.valor)}</td></tr>`).join('')}</tbody></table>` : '<p class="nota">Não trabalhou neste período.</p>'}</div></details>`;
  $('hLista').innerHTML = (comCpf.map(cartao).join('') || '') +
    (semCpf.length ? `<h3 style="margin:18px 0 8px">Sem CPF (lançados antes do cadastro)</h3>${editor ? '<p class="nota" style="margin:0 0 8px">Complete o CPF para que o histórico dessas pessoas fique no cadastro.</p>' : ''}${semCpf.map(cartao).join('')}` : '') ||
    `<p class="vazio">${busca ? 'Ninguém encontrado com essa busca.' : 'Nenhum funcionário neste ano.'}</p>`;
  $('hLista')._pessoas = lista;
}
$('hBusca').oninput = () => H && desenharHist();
$('hAno').onchange = () => H && desenharHist();
$('hLista').addEventListener('click', e => {
  const b = e.target.closest('[data-hedit],[data-hcpf]'); if (!b) return;
  e.preventDefault();
  const p = $('hLista')._pessoas.find(x => x.k === (b.dataset.hedit || b.dataset.hcpf));
  if (b.dataset.hedit) abrirF('editar', 'Editar cadastro', { cadastro: p.cad });
  else abrirF('completar', 'Completar CPF', { nome: p.nome, antigo: { nome: p.ls[0].nome, funcao: p.funcao, valor: p.ls[0].valor_diaria } });
});
function aba(t) {
  $('abaFolha').setAttribute('aria-pressed', t === 'folha'); $('abaHist').setAttribute('aria-pressed', t === 'hist');
  $('telaFolha').hidden = t !== 'folha'; $('telaHist').hidden = t !== 'hist';
  if (t === 'hist') carregarHist();
}
$('abaFolha').onclick = () => aba('folha');
$('abaHist').onclick = () => { H = null; aba('hist'); };   // recarrega para incluir o que foi lançado na folha

// Eventos
$('selQuinzena').onchange = e => abrirQuinzena(e.target.value);
$('btnNova').onclick = () => abrirQ('nova');
$('btnEditarQ').onclick = () => abrirQ('editar');
$('btnSalvarQ').onclick = salvarQ;
$('btnSalvarF').onclick = salvarF;
$('btnPDF').onclick = () => gerarPDF(atual, dias, funcs, pontos).catch(e => alert(msg(e)));
$('btnExcluirQ').onclick = async () => {
  if (!confirm('Excluir esta quinzena com todos os funcionários e pontos? Isso não pode ser desfeito.')) return;
  try { await DB.excluirQuinzena(atual.id); atual = null; await carregarQuinzenas(); } catch (e) { alert(msg(e)); }
};
document.querySelectorAll('[data-fechar]').forEach(b => b.onclick = () => $(b.dataset.fechar).close());
$('conteudo').addEventListener('change', async e => {
  const i = e.target;
  if (i.dataset.cfg) {
    const v = parseFloat(String(i.value).replace(',', '.'));
    if (isNaN(v) || v < 0) { alert('Informe um valor válido.'); return redesenhar(); }
    try { await DB.editarQuinzena(atual.id, { [i.dataset.cfg]: v }); atual[i.dataset.cfg] = v; redesenhar(); } catch (err) { alert('Não foi possível salvar: ' + msg(err)); }
    return;
  }
  if (i.dataset.aj) {
    const d = i.dataset.aj, bruto = i.value.trim(), aj = { ...(atual.ajuste_refeicoes || {}) };
    if (bruto === '') delete aj[d];
    else { const n = Number(bruto.replace(',', '.')); if (!Number.isInteger(n) || n < 0) { alert('Use um número inteiro (0 ou mais).'); return redesenhar(); } aj[d] = n; }
    try { await DB.editarQuinzena(atual.id, { ajuste_refeicoes: aj }); atual.ajuste_refeicoes = aj; redesenhar(); } catch (err) { alert('Não foi possível salvar: ' + msg(err)); }
    return;
  }
  if (i.closest('td[data-d]')) return lancar(i);
  const tr = i.closest('tr[data-f]'); if (!tr || !i.dataset.campo) return;
  try {
    if (i.dataset.campo === 'nome') { if (!i.value.trim()) return abrirQuinzena(atual.id); await DB.editarFuncionario(tr.dataset.f, { nome: i.value.trim() }); }
    else { await DB.editarFuncionario(tr.dataset.f, { valor_diaria: Math.max(0, parseFloat(i.value) || 0) }); }
    await abrirQuinzena(atual.id);
  } catch (err) { alert('Não foi possível salvar: ' + msg(err)); }
});
$('conteudo').addEventListener('click', async e => {
  const add = e.target.dataset.add, del = e.target.dataset.del;
  if (add) { funcaoNova = add; abrirF('quinzena', 'Adicionar ' + (add === 'servente' ? 'servente' : 'pedreiro')); }
  if (del) {
    const f = funcs.find(x => x.id === del);
    if (!confirm('Excluir ' + f.nome + ' e todos os pontos dele nesta quinzena?')) return;
    try { await DB.excluirFuncionario(del); await abrirQuinzena(atual.id); } catch (err) { alert(msg(err)); }
  }
});
iniciar().catch(e => document.body.insertAdjacentHTML('afterbegin', '<p class="erro" style="padding:20px">Erro ao carregar: ' + esc(msg(e)) + '</p>'));

// Geração do PDF (jsPDF + autoTable)
async function gerarPDF(q, dias, funcs, pontos) {
  const jsPDF = await libsPdf('jspdf', 'autotable');
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
  doc.setFontSize(15); doc.text('PLANILHA DE PONTOS', 148, 14, { align: 'center' });
  doc.setFontSize(10);
  doc.text('OBRA: ' + q.obra, 10, 22);
  doc.text('QUINZENA: ' + fmtData(q.data_inicio) + ' a ' + fmtData(q.data_fim), 10, 27);
  let y = 32, geral = 0;
  [['servente', 'SERVENTES'], ['pedreiro', 'PEDREIROS']].forEach(([f, titulo]) => {
    const lista = funcs.filter(x => x.funcao === f);
    let soma = 0;
    const corpo = lista.map(x => {
      const t = totalFunc(x.id, pontos), pagar = t * x.valor_diaria; soma += pagar;
      return [x.nome, ...dias.map(d => { const v = pontos[x.id + '|' + d]; return v == null ? '' : String(v).replace('.', ','); }),
        String(t).replace('.', ','), brl(x.valor_diaria), brl(pagar)];
    });
    corpo.push([{ content: 'TOTAL ' + titulo, colSpan: dias.length + 3, styles: { halign: 'right', fontStyle: 'bold' } }, { content: brl(soma), styles: { fontStyle: 'bold' } }]);
    geral += soma;
    doc.autoTable({
      startY: y, margin: { left: 10, right: 10 }, styles: { fontSize: 7, cellPadding: 1.2, halign: 'center' },
      head: [[titulo, ...dias.map(d => diaSemana(d) + '\n' + d.slice(8) + '/' + d.slice(5, 7)), 'TOTAL', 'VALOR', 'A RECEBER']],
      body: corpo, headStyles: { fillColor: [122, 139, 111] }, columnStyles: { 0: { halign: 'left', cellWidth: 38 } }
    });
    y = doc.lastAutoTable.finalY + 6;
  });
  const r = refeicoes();
  doc.autoTable({
    startY: y, margin: { left: 10, right: 10 }, styles: { fontSize: 7, cellPadding: 1.2, halign: 'center' },
    head: [['ALIMENTAÇÃO', ...dias.map(d => diaSemana(d) + '\n' + d.slice(8) + '/' + d.slice(5, 7)), 'TOTAL']],
    body: [
      ['Serventes presentes', ...r.linhas.map(l => l.s), r.s],
      ['Pedreiros presentes', ...r.linhas.map(l => l.p), r.p],
      ['Almoços', ...r.linhas.map(l => l.alm), r.alm],
      ['Pães', ...r.linhas.map(l => l.paes), r.paes],
      ['Custo do dia', ...r.linhas.map(l => brl(l.custo)), brl(r.custo)]
    ],
    headStyles: { fillColor: [122, 139, 111] }, columnStyles: { 0: { halign: 'left', cellWidth: 38 } }
  });
  y = doc.lastAutoTable.finalY + 6;
  if (y > 170) { doc.addPage(); y = 15; }
  doc.setFontSize(8); doc.setFont(undefined, 'normal');
  doc.text('Almoço: ' + brl(r.c.pa) + '  |  Pão: ' + brl(r.c.pp) + '  |  Pães por almoço: ' + String(r.c.ppa).replace('.', ','), 10, y);
  doc.setFontSize(10); doc.setFont(undefined, 'bold');
  doc.text('TOTAL MÃO DE OBRA: ' + brl(geral), 287, y, { align: 'right' });
  doc.text('TOTAL ALIMENTAÇÃO: ' + brl(r.custo), 287, y + 6, { align: 'right' });
  doc.setFontSize(12);
  doc.text('TOTAL GERAL: ' + brl(geral + r.custo), 287, y + 13, { align: 'right' });
  doc.setFont(undefined, 'normal'); doc.setFontSize(8);
  doc.text('Gerado em ' + new Date().toLocaleString('pt-BR'), 10, 203);
  doc.save('folha-ponto_' + q.data_inicio + '_a_' + q.data_fim + '.pdf');
}
