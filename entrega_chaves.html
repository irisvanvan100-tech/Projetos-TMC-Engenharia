<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A8B6F">
<title>Entrega de Chaves | TMC Engenharia</title>
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="componentes.css">
<style>
.vinc{border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:10px 12px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.vinc div{min-width:0}
.vinc small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.vinc b{font-size:14px;overflow-wrap:anywhere}
.vinc .full{grid-column:1/-1}
.vinc .lk{border:1px solid var(--accent);background:var(--surface);color:var(--accent-strong);border-radius:6px;padding:7px 10px;font-weight:700;justify-self:start}
.vinc .novo{grid-column:1/-1;font-size:12px;color:var(--ok);font-weight:600}
@media (max-width:480px){.vinc{grid-template-columns:1fr}}
textarea.livre{text-transform:none;min-height:70px}
.gi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gi .t{flex:1;min-width:200px}
/* ----- termo (A4 em pé),papel branco,no estilo do modelo ----- */
.termo{width:794px;height:1123px;background:#fff;color:#111;box-shadow:0 2px 14px #0000002a;padding:120px 82px 80px; font:17px/1.62 Calibri,Carlito,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;color-scheme:light}
.termo .lg{width:190px;align-self:center}
.termo h3{font-size:22px;font-weight:700;text-align:center;margin:80px 0 50px;letter-spacing:.01em}
.termo p.corpo{margin:0;text-align:justify}
.termo .local{text-align:right;margin-top:46px;font-size:15px}
.termo .ass{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:0}
.termo .ass .ln{width:420px;border-top:1px solid #111;margin-top:60px}
.termo .ass b{font-size:17px;margin-top:6px;text-align:center}
.termo .ass small{font-size:13px}
#scaleBox{max-width:794px}
</style>
</head>
<body>
<p id="carregando">Carregando…</p>
<div id="sistema" class="oculto">
<header class="topo">
  <img class="marca" src="logo.jpg" alt="TMC Engenharia">
  <h1>Entrega de Chaves</h1>
  <span class="quem" id="quem"></span>
  <a class="btnlink" id="linkInicio" href="index.html" hidden>Início</a>
  <button id="btnSair" type="button">Sair</button>
</header>

<main class="wrap">
  <div class="abas"><button id="abaNova" type="button" aria-pressed="true">🔑 Termo de entrega</button><button id="abaReg" type="button" aria-pressed="false">🗂 Entregas registradas</button></div>

  <div id="telaNova" style="display:flex;flex-direction:column;gap:14px">
    <section class="panel">
      <h2 id="tituloForm">Vistoria da unidade</h2>
      <label class="f" for="selVist">Escolha a vistoria guardada</label>
      <select id="selVist"></select>
      <div id="vinc"></div>
    </section>

    <section class="panel">
      <h2>Dados da entrega</h2>
      <label class="f" for="cpf">CPF do cliente *</label>
      <input type="text" id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14">
      <label class="f" for="end">Endereço do apartamento *</label>
      <textarea id="end" class="livre" lang="pt-BR" spellcheck="true" placeholder="Ex.: Rua Local SDO 18, 414, (Park Vitória), 101 B, Jabuti, Itaitinga - CE"></textarea>
      <div class="grid2">
        <div><label class="f" for="cidade">Cidade (para a data do termo)</label><input type="text" id="cidade" value="Itaitinga"></div>
        <div><label class="f" for="dataEnt">Data da entrega *</label><input type="date" id="dataEnt"></div>
      </div>
      <p class="err" id="erro" role="alert"></p>
      <div class="acoes" style="margin-top:6px">
        <button class="btn sec" id="btnLimpar" type="button">Limpar</button>
        <button class="btn" id="btnGuardar" type="button">💾 Guardar entrega</button>
      </div>
      <p class="enviado" id="salvoInfo" hidden></p>
    </section>
  </div>

  <div id="telaReg" style="display:none;flex-direction:column;gap:14px">
    <section class="panel"><h2>Entregas registradas</h2><input type="text" id="busca" placeholder="🔍 Buscar por cliente, unidade ou CPF" autocomplete="off"></section>
    <div class="gl" id="registros"></div>
  </div>
</main>

<div class="fab" id="fab"><button class="btn" id="btnPrev" type="button">📄 Ver prévia e gerar PDF</button></div>
</div>

<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-label="Prévia do termo" hidden>
  <div class="ovbar"><b>Termo de recebimento</b><button class="claro" id="btnBaixar" type="button">⬇ Baixar PDF</button><button class="vidro" id="btnFechar" type="button">Fechar</button></div>
  <div class="ovbody"><div class="ovnote" id="ovnote" style="max-width:794px"></div>
    <div id="scaleBox" style="overflow:hidden;margin:0 auto"><div class="scaler" id="scaler"><article class="termo" id="paper"></article></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="comum.js"></script>
<script>
const EMPRESA = { nome: 'TMC Engenharia e Serviços Ltda', cnpj: '56.121.081/0001-32' };
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const porExtenso = d => { if (!d) return '____'; const [a, m, dd] = d.split('-'); return `${+dd} de ${MESES[+m - 1]} de ${a}`; };
const dataLocal = d => { if (!d) return ''; const [a, m, dd] = d.split('-'); return `${dd} / ${MESES[+m - 1]} / de ${a}`; };
const chave = (o, u) => (String(o).trim() + '|' + String(u).trim()).toLowerCase();


let perfil, editor = false, vistorias = [], ultimas = new Map(), registros = [], editando = null;
const f = { vistoria: null, cpf: '', end: '', cidade: 'Itaitinga', data: hojeISO() };

// Vistoria mais nova da mesma unidade (se a vistoria for guardada de novo, a entrega acompanha)
function maisNova(obra, unidade) { return ultimas.get(chave(obra, unidade)) || null; }
async function carregar() {
  vistorias = ok(await sb.from('vistorias').select('id,criado_em,obra,unidade,cliente,data,pdf').order('criado_em', { ascending: false }).limit(2000));
  ultimas = new Map(); vistorias.forEach(v => { const kk = chave(v.obra, v.unidade); if (!ultimas.has(kk)) ultimas.set(kk, v); });
  registros = ok(await sb.from('entregas_chaves').select('*').order('criado_em', { ascending: false }).limit(2000));
}
function montaSelect() {
  const l = [...ultimas.values()].sort((a, b) => (a.obra + a.unidade).localeCompare(b.obra + b.unidade, 'pt', { numeric: true }));
  $('selVist').innerHTML = '<option value="">— escolha —</option>' + l.map(v => `<option value="${v.id}">${esc(v.obra)} • ${esc(v.unidade)} — ${esc(v.cliente)} (vistoria ${fmtData(v.data)})</option>`).join('');
  if (f.vistoria) $('selVist').value = f.vistoria.id;
}
function desenhaVinc() {
  const v = f.vistoria;
  if (!v) { $('vinc').innerHTML = vistorias.length ? '' : '<p class="enviado">Nenhuma vistoria guardada ainda. Guarde a vistoria da unidade primeiro, na página Vistoria.</p>'; return; }
  $('vinc').innerHTML = `<div class="vinc"><div class="full"><small>Cliente (vem da vistoria)</small><b>${esc(UP(v.cliente))}</b></div>
    <div><small>Empreendimento</small><b>${esc(v.obra)}</b></div><div><small>Unidade</small><b>${esc(v.unidade)}</b></div>
    <div><small>Data da vistoria</small><b>${fmtData(v.data)}</b></div><div><small>Guardada em</small><b>${new Date(v.criado_em).toLocaleDateString('pt-BR')}</b></div>
    ${v._trocou ? `<div class="novo">✓ Atualizado com a vistoria mais nova desta unidade.</div>` : ''}
    ${v.pdf ? `<button class="lk full" type="button" data-pdf="${esc(v.pdf)}">📄 Abrir PDF da vistoria</button>` : ''}</div>`;
}
function escolhe(v) {
  f.vistoria = v;
  // endereço sugerido: o último usado no mesmo empreendimento
  if (v && !$('end').value.trim()) { const r = registros.find(x => x.obra.toLowerCase() === v.obra.toLowerCase()); if (r) { $('end').value = r.endereco; f.end = r.endereco; } }
  desenhaVinc();
}
$('selVist').onchange = () => escolhe(vistorias.find(v => v.id == $('selVist').value) || null);
$('cpf').oninput = () => { const c = $('cpf'); c.value = mascaraCpf(c.value); f.cpf = c.value; c.classList.remove('falta'); };
$('end').oninput = () => { f.end = $('end').value; $('end').classList.remove('falta'); };
$('cidade').oninput = () => f.cidade = $('cidade').value;
$('dataEnt').onchange = () => f.data = $('dataEnt').value;
$('dataEnt').value = f.data;

// ===== TERMO =====
function termoHTML(d) {
  const nome = UP(d.cliente);
  return `<img class="lg" src="logo.jpg" alt="TMC Engenharia">
    <h3>TERMO DE RECEBIMENTO DE CHAVES, POSSE E VISTORIA</h3>
    <p class="corpo"><b>${esc(nome)}</b>, inscrito (a) no cadastro de pessoa física (CPF) sob o nº ${esc(d.cpf)} DECLARA a quem possa interessar, que:
    Recebeu as chaves do imóvel situado na ${esc(d.endereco)} livre de bens e pessoas, realizada por ${EMPRESA.nome}, inscrito (a) no cadastro de pessoa jurídica (CNPJ)
    sob o nº ${EMPRESA.cnpj}. Desta forma, o (a) recebedor (a) das chaves, DECLARA que passou a exercer a posse do imóvel, podendo dele usar, gozar/fruir e/ou dispor,
    conforme desejar. DECLARA ainda que, recebeu o bem nas exatas condições aferidas, ratificadas e aceitas durante a vistoria do imóvel que realizou em ${porExtenso(d.dataVistoria)}.</p>
    <div class="local">${esc(d.cidade || '')}, ${dataLocal(d.dataEntrega)}.</div>
    <div class="ass"><div class="ln"></div><b>${esc(nome)}</b><small>Declarante</small>
      <div class="ln"></div><b>${EMPRESA.nome}</b><small>Declarador</small></div>`;
}
const dadosForm = () => ({ cliente: f.vistoria?.cliente || '', cpf: f.cpf, endereco: f.end.trim(), cidade: f.cidade.trim(), dataEntrega: f.data, dataVistoria: f.vistoria?.data, obra: f.vistoria?.obra, unidade: f.vistoria?.unidade });
function faltas() {
  const r = [];
  if (!f.vistoria) r.push(['selVist', 'Escolha a vistoria']);
  if (!cpfValido(f.cpf)) r.push(['cpf', f.cpf ? 'CPF inválido: confira os números' : 'Falta o CPF']);
  if (!f.end.trim()) r.push(['end', 'Falta o endereço do apartamento']);
  if (!f.data) r.push(['dataEnt', 'Falta a data da entrega']);
  return r;
}
const ajusta = () => encaixarFolha($('scaleBox'), $('scaler'), 794, 1123);
addEventListener('resize', ajusta);
let prevDados = null;
function abrePrevia(d, avisos) {
  prevDados = d; $('paper').innerHTML = termoHTML(d);
  $('ovnote').innerHTML = avisos && avisos.length ? `<b>Antes de imprimir, confira:</b><ul>${avisos.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
  abrirJanela($('ov')); ajusta(); $('btnFechar').focus();
}
$('btnPrev').onclick = () => abrePrevia(dadosForm(), faltas().map(x => x[1]));
$('btnFechar').onclick = () => fecharJanela($('ov'));
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('ov').hidden) $('btnFechar').click(); });

const gerarPdf = d => pdfDaFolha(termoHTML(d), 'termo', false);
$('btnBaixar').onclick = async () => {
  const d = prevDados;
  if (!d.cliente || !cpfValido(d.cpf) || !d.endereco) return toast('Complete a vistoria, o CPF e o endereço antes de baixar.');
  const b = $('btnBaixar'); b.disabled = true; b.textContent = 'Gerando…';
  try { (await gerarPdf(d)).save(nomeArquivo('termo_entrega_chaves', d.obra, d.unidade)); }
  catch (e) { toast('Não foi possível gerar o PDF: ' + msg(e)); }
  b.disabled = false; b.textContent = '⬇ Baixar PDF';
};

// ===== GUARDAR =====
$('btnGuardar').onclick = async () => {
  const fl = faltas();
  ['selVist', 'cpf', 'end', 'dataEnt'].forEach(id => $(id).classList.toggle('falta', fl.some(x => x[0] === id)));
  if (fl.length) { $('erro').textContent = fl.map(x => x[1]).join(' • ') + '.'; return $(fl[0][0]).focus(); }
  $('erro').textContent = '';
  const v = f.vistoria, dados = { vistoria_id: v.id, obra: v.obra, unidade: v.unidade, cpf: f.cpf, endereco: f.end.trim(), cidade: f.cidade.trim() || 'Itaitinga', data_entrega: f.data };
  const b = $('btnGuardar'); b.disabled = true;
  try {
    if (editando) { ok(await sb.from('entregas_chaves').update(dados).eq('id', editando)); Object.assign(registros.find(r => r.id === editando), dados); }
    else { const r = ok(await sb.from('entregas_chaves').insert({ ...dados, criado_por: perfil.nome }).select().single()); registros.unshift(r); editando = r.id; }
    $('salvoInfo').hidden = false; $('salvoInfo').textContent = `✓ Entrega guardada. Agora gere o PDF e imprima para o cliente assinar.`;
    $('tituloForm').textContent = 'Vistoria da unidade (editando entrega guardada)';
    toast('Entrega guardada.');
  } catch (e) { $('erro').textContent = 'Não foi possível guardar: ' + msg(e); }
  b.disabled = false;
};
function limpar() {
  editando = null; Object.assign(f, { vistoria: null, cpf: '', end: '', cidade: 'Itaitinga', data: hojeISO() });
  $('selVist').value = ''; $('cpf').value = ''; $('end').value = ''; $('cidade').value = 'Itaitinga'; $('dataEnt').value = f.data;
  $('salvoInfo').hidden = true; $('erro').textContent = ''; $('tituloForm').textContent = 'Vistoria da unidade';
  document.querySelectorAll('.falta').forEach(x => x.classList.remove('falta')); desenhaVinc();
}
$('btnLimpar').onclick = limpar;

// ===== REGISTRADAS =====
function vistDoRegistro(r) {
  const nova = maisNova(r.obra, r.unidade) || vistorias.find(v => v.id === r.vistoria_id);
  return nova ? { ...nova, _trocou: nova.id !== r.vistoria_id } : null;
}
function listaReg() {
  const b = $('busca').value.trim().toLowerCase();
  const l = registros.map(r => ({ r, v: vistDoRegistro(r) })).filter(({ r, v }) => !b || `${v?.cliente} ${r.obra} ${r.unidade} ${r.cpf}`.toLowerCase().includes(b));
  $('registros').innerHTML = l.map(({ r, v }) => `<div class="gi"><div class="t"><b>${esc(UP(v?.cliente || '?'))}</b>
      <small>${esc(r.obra)} • ${esc(r.unidade)} • CPF ${esc(r.cpf)} • entrega ${fmtData(r.data_entrega)} • vistoria ${fmtData(v?.data)}</small></div>
      <button type="button" data-termo="${r.id}">📄 Termo</button>${v?.pdf ? `<button type="button" data-pdf="${esc(v.pdf)}">Vistoria</button>` : ''}<button type="button" data-abrir="${r.id}">✏️ Abrir</button></div>`).join('')
    || `<p class="enviado">${registros.length ? 'Nenhuma entrega encontrada.' : 'Nenhuma entrega registrada ainda.'}</p>`;
}
$('busca').oninput = listaReg;
function dadosRegistro(r) { const v = vistDoRegistro(r); return { cliente: v?.cliente || '', cpf: r.cpf, endereco: r.endereco, cidade: r.cidade, dataEntrega: r.data_entrega, dataVistoria: v?.data, obra: r.obra, unidade: r.unidade }; }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-pdf],[data-termo],[data-abrir]'); if (!b) return;
  if (b.dataset.pdf) abrirArquivo('vistorias', b.dataset.pdf);
  else if (b.dataset.termo) abrePrevia(dadosRegistro(registros.find(r => r.id == b.dataset.termo)));
  else if (b.dataset.abrir) {
    const r = registros.find(x => x.id == b.dataset.abrir); limpar(); editando = r.id;
    Object.assign(f, { cpf: r.cpf, end: r.endereco, cidade: r.cidade, data: r.data_entrega });
    $('cpf').value = r.cpf; $('end').value = r.endereco; $('cidade').value = r.cidade; $('dataEnt').value = r.data_entrega;
    escolhe(vistDoRegistro(r)); $('selVist').value = f.vistoria?.id ?? '';
    $('tituloForm').textContent = 'Vistoria da unidade (editando entrega guardada)'; aba('nova');
  }
});
function aba(t) {
  $('abaNova').setAttribute('aria-pressed', t === 'nova'); $('abaReg').setAttribute('aria-pressed', t === 'reg');
  $('telaNova').style.display = t === 'nova' ? 'flex' : 'none'; $('telaReg').style.display = t === 'reg' ? 'flex' : 'none';
  $('fab').classList.toggle('oculto', t !== 'nova'); if (t === 'reg') listaReg(); scrollTo(0, 0);
}
$('abaNova').onclick = () => aba('nova'); $('abaReg').onclick = () => aba('reg');

(async () => {
  ({ perfil, editor } = await TMC.iniciarPagina('entrega'));
  await carregar(); montaSelect();
  // vindo da página Vistoria (?v=id): já seleciona a vistoria
  const pid = new URLSearchParams(location.search).get('v');
  if (pid) { const v = vistorias.find(x => x.id == pid); if (v) { const nova = maisNova(v.obra, v.unidade) || v; $('selVist').value = nova.id; escolhe(nova); } }
  desenhaVinc();
  if (!editor) { $('btnGuardar').disabled = true; }
  TMC.mostrarPagina();
})().catch(TMC.falhaAoAbrir);
</script>
</body>
</html>
