<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://aaajvihtdhpootilcgll.supabase.co" crossorigin>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7A8B6F">
<title>Cronograma | TMC Engenharia</title>
<link rel="stylesheet" href="estilo.css">
<style>
:root{--olivaesc:#5d6d53}
.abas{display:flex;gap:6px;padding:10px 12px 0;max-width:900px;margin:auto}
.abas button{flex:1;border:1px solid var(--oliva);background:#fff;color:var(--oliva);border-radius:10px;padding:9px 6px;cursor:pointer}
.abas button.on{background:var(--oliva);color:#fff;font-weight:600}
main{padding:12px;max-width:900px;margin:auto}
.card{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:12px;margin-bottom:12px}
select,input{padding:10px;border-radius:10px;border:1px solid var(--borda);width:100%;margin:4px 0;background:#fff}
.btn{background:var(--oliva);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;width:100%;margin:4px 0;cursor:pointer}
.pq{border:1px solid var(--borda);background:#fff;border-radius:8px;padding:5px 9px;cursor:pointer}
.row{display:flex;gap:8px}
.row>*{flex:1}
.bar{height:10px;background:#e8e2d6;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--oliva)}
.sech{display:flex;justify-content:space-between;align-items:center;font-weight:700;cursor:pointer;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #f0ece3;gap:6px}
.item span{font-size:13px;flex:1}
.lt{display:flex;gap:4px}
.lt button{width:36px;height:36px;border-radius:8px;border:1px solid #ccc;background:#fff;font-weight:700;cursor:pointer}
.lt button.on{color:#fff;border:0}
.cA{background:#f2c94c!important}
.cB{background:#e8a33d!important}
.cC{background:#9bbf7a!important}
.cD{background:#3f8f4f!important}
.big{font-size:28px;font-weight:800;color:var(--olivaesc)}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:4px}
.chips button{white-space:nowrap;border:1px solid var(--oliva);background:#fff;color:var(--oliva);border-radius:20px;padding:7px 12px;cursor:pointer}
.chips button.on{background:var(--oliva);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px;border-bottom:1px solid #eee;text-align:left}
.muted{color:#777;font-size:12px}
.peso input{width:80px;display:inline;margin:0 4px}
body.view .lt button:not(.on){display:none}
body.busy{cursor:progress}
</style>
</head>
<body>
<p id="carregando">Carregando…</p>
<div id="sistema" class="oculto">
<header class="topo">
  <img class="marca" src="logo.jpg" alt="TMC Engenharia">
  <h1>Cronograma</h1>
  <span class="quem" id="quem"></span>
  <a class="btnlink" id="linkInicio" href="index.html" hidden>Início</a>
  <button id="btnSair" type="button">Sair</button>
</header>
  <div class="abas">
    <button data-tela="c" class="on">📅 Andamento</button>
    <button data-tela="o">🏗️ Obras</button>
    <button data-tela="h">🕘 Histórico</button>
  </div>
  <main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="comum.js"></script>
<script src="setores.js"></script>
<script>
const APTS = ['101', '102', '201', '202'], VAL = { A: 25, B: 50, C: 75, D: 100 };
const mem = memoria('tmc_');
let perfil, editor = false, aoVivo = false, obras = [], status = {}, pesos = [], hist = [];
const st = { tela: 'c', obra: null, bloco: 0, apt: -1, aberta: -1 };

// ===== DADOS =====
async function carregar() {
  let linhas, ps;
  [obras, linhas, ps] = await Promise.all([
    todos(() => sb.from('crono_obras').select('nome,blocos').order('nome')),
    todos(() => sb.from('crono_status').select('obra,setor,item,apto,nivel')),
    sb.from('crono_pesos').select('setor,peso').then(ok)
  ]);
  status = {}; linhas.forEach(r => { (status[r.obra] ??= {})[r.setor + '|' + r.item + '|' + r.apto] = r.nivel; });
  pesos = SETORES.map((_, i) => { const x = ps.find(p => p.setor === i); return x ? +x.peso : 0; });
  if (!pesos.some(p => p > 0)) pesos = SETORES.map(() => +(100 / SETORES.length).toFixed(2)); // sem pesos cadastrados: todos iguais
  escolherObra();
}
function escolherObra() { if (!obras.some(o => o.nome === st.obra)) st.obra = (obras.find(o => o.nome === mem.ler('obra')) || obras[0])?.nome ?? null; }
// Cópia no aparelho: a página abre na hora com ela e se atualiza com o banco em seguida
const guardar = () => ({ obras, status, pesos });
const restaurar = d => { ({ obras, status, pesos } = d); escolherObra(); };
const registrar = texto => sb.from('historico').insert({ modulo: 'cronograma', usuario: perfil.nome, texto }).then(() => {}, () => {});

// ===== CÁLCULOS =====
const ob = () => obras.find(o => o.nome === st.obra);
const mapa = nome => status[nome] || {};
// apartamentos atingidos pela seleção: bloco -1 = todos os blocos; apto -1 = os 4 aptos
const blocosSel = () => st.bloco < 0 ? [...Array(ob().blocos).keys()] : [st.bloco];
const cols = () => blocosSel().flatMap(b => st.apt < 0 ? [b * 4, b * 4 + 1, b * 4 + 2, b * 4 + 3] : [b * 4 + st.apt]);
const nomeSel = () => (st.bloco < 0 ? 'Todos os blocos' : 'Bloco ' + (st.bloco + 1)) + (st.apt < 0 ? '' : ' • Apto ' + APTS[st.apt]);
const todasCols = o => [...Array(o.blocos * 4).keys()];
const pI = (m, si, ii, cs) => cs.reduce((a, c) => a + (VAL[m[si + '|' + ii + '|' + c]] || 0), 0) / cs.length;
const pS = (m, si, cs) => SETORES[si].itens.reduce((a, _, ii) => a + pI(m, si, ii, cs), 0) / SETORES[si].itens.length;
const pO = (m, cs) => { const t = pesos.reduce((a, b) => a + b, 0) || 1; return SETORES.reduce((a, _, si) => a + pS(m, si, cs) * pesos[si], 0) / t; };

// ===== AÇÕES =====
async function marca(si, ii, L) {
  if (!editor) return;
  const o = st.obra, cs = cols(), m = (status[o] ??= {});
  document.body.classList.add('busy');
  try {
    if (L) ok(await sb.from('crono_status').upsert(cs.map(apto => ({ obra: o, setor: si, item: ii, apto, nivel: L, atualizado_por: perfil.nome, atualizado_em: new Date().toISOString() }))));
    else ok(await sb.from('crono_status').delete().eq('obra', o).eq('setor', si).eq('item', ii).in('apto', cs));
    cs.forEach(c => { if (L) m[si + '|' + ii + '|' + c] = L; else delete m[si + '|' + ii + '|' + c]; });
    registrar(`${o} • ${nomeSel()} (${cs.length} ${cs.length === 1 ? 'apto' : 'aptos'}) • ${SETORES[si].itens[ii]}: ${L ? L + ' (' + VAL[L] + '%)' : 'zerado'}`);
    render();
  } catch (e) { toast('Não foi possível salvar: ' + msg(e)); }
  document.body.classList.remove('busy');
}
async function mudaPeso(si, v) {
  v = parseFloat(String(v).replace(',', '.'));
  if (isNaN(v) || v < 0) { toast('Informe um peso válido.'); return render(); }
  try { ok(await sb.from('crono_pesos').upsert({ setor: si, peso: v })); pesos[si] = v; registrar(`Peso do setor ${SETORES[si].nome}: ${v}%`); render(); }
  catch (e) { toast('Não foi possível salvar: ' + msg(e)); }
}
async function addObra() {
  const nome = $('on').value.trim().toUpperCase(), b = parseInt($('ob').value);
  if (!nome || !(b > 0)) return toast('Informe o nome e a quantidade de blocos.');
  if (obras.some(o => o.nome.toLowerCase() === nome.toLowerCase())) return toast('Essa obra já existe. Ajuste os blocos dela na lista abaixo.');
  try {
    ok(await sb.from('crono_obras').insert({ nome, blocos: b }));
    obras.push({ nome, blocos: b }); obras.sort((a, c) => a.nome.localeCompare(c.nome));
    st.obra = nome; st.bloco = 0; registrar(`Obra cadastrada: ${nome} (${b} blocos, ${b * 4} aptos)`); go('c');
  } catch (e) { toast('Não foi possível cadastrar: ' + msg(e)); }
}
async function editObra(i) {
  const o = obras[i];
  const nome = prompt('Nome da obra:', o.nome); if (nome === null) return;
  const b = parseInt(prompt(`Quantidade de blocos de ${nome.trim() || o.nome}:`, o.blocos)); if (!(b > 0)) return toast('A obra precisa ter pelo menos 1 bloco.');
  const novo = nome.trim().toUpperCase() || o.nome;
  if (novo !== o.nome && obras.some(x => x.nome === novo)) return toast('Já existe uma obra com esse nome.');
  if (b < o.blocos && !confirm(`Diminuir de ${o.blocos} para ${b} blocos esconde o andamento dos blocos ${b + 1} a ${o.blocos}. Continuar?`)) return;
  try {
    ok(await sb.from('crono_obras').update({ nome: novo, blocos: b }).eq('nome', o.nome));
    if (novo !== o.nome) { status[novo] = status[o.nome]; delete status[o.nome]; if (st.obra === o.nome) st.obra = novo; }
    registrar(`Obra ${o.nome}${novo !== o.nome ? ' renomeada para ' + novo : ''}: ${b} blocos`);
    o.nome = novo; o.blocos = b; if (st.obra === novo && st.bloco >= b) st.bloco = 0;
    render();
  } catch (e) { toast('Não foi possível salvar: ' + msg(e)); }
}
async function delObra(i) {
  const o = obras[i];
  if (!confirm(`Excluir a obra "${o.nome}" e todo o andamento dela? Isso não pode ser desfeito.`)) return;
  if (prompt(`Para confirmar, digite o nome da obra: ${o.nome}`)?.trim().toUpperCase() !== o.nome) return toast('Nome diferente. Nada foi excluído.');
  try {
    ok(await sb.from('crono_obras').delete().eq('nome', o.nome));
    obras.splice(i, 1); delete status[o.nome];
    if (st.obra === o.nome) { st.obra = obras[0]?.nome ?? null; st.bloco = 0; }
    registrar(`Obra excluída: ${o.nome}`); toast('Obra excluída.'); render();
  } catch (e) { toast(e && e.code === '23503' ? 'Essa obra tem material lançado no Estoque, por isso não pode ser excluída.' : 'Não foi possível excluir: ' + msg(e)); }
}

// ===== TELAS =====
function rC() {
  const ativas = obras;
  if (!ativas.length) return `<div class="card">Nenhuma obra cadastrada.${editor ? ' Vá na aba <b>Obras</b> para cadastrar.' : ''}</div>`;
  const o = ob(), m = mapa(o.nome), cs = cols(), B = o.blocos;
  let h = `<div class="card"><select id="selObra" aria-label="Obra">${ativas.map(x => `<option value="${esc(x.nome)}" ${x.nome === o.nome ? 'selected' : ''}>${esc(x.nome)} (${x.blocos} blocos)</option>`).join('')}</select>
  <div class="chips"><button class="${st.bloco < 0 ? 'on' : ''}" data-bloco="-1">Todos os blocos</button>${[...Array(B).keys()].map(i => `<button class="${i === st.bloco ? 'on' : ''}" data-bloco="${i}">Bloco ${i + 1} • ${pO(m, [i * 4, i * 4 + 1, i * 4 + 2, i * 4 + 3]).toFixed(0)}%</button>`).join('')}</div>
  <div class="chips" style="margin-top:6px"><button class="${st.apt < 0 ? 'on' : ''}" data-apt="-1">Todos os aptos</button>${APTS.map((a, i) => `<button class="${i === st.apt ? 'on' : ''}" data-apt="${i}">Apto ${a}</button>`).join('')}</div>
  <div class="row" style="margin-top:10px"><div><div class="muted">${nomeSel()}</div><div class="big">${pO(m, cs).toFixed(1)}%</div></div><div><div class="muted">Obra inteira</div><div class="big">${pO(m, todasCols(o)).toFixed(1)}%</div></div></div>
  <div class="bar"><i style="width:${pO(m, cs)}%"></i></div><p class="muted">A = 25% • B = 50% • C = 75% • D = 100%${editor ? ` • A marcação vale para <b>${cs.length} ${cs.length === 1 ? 'apartamento' : 'apartamentos'}</b> (${nomeSel()}${st.apt < 0 ? ', todos os aptos' : ''}).` : ''}</p></div>`;
  SETORES.forEach((s, si) => {
    const p = pS(m, si, cs);
    h += `<div class="card"><div class="sech" data-abre="${si}"><span>${esc(s.nome)}</span><span>${p.toFixed(0)}% ${st.aberta === si ? '▲' : '▼'}</span></div><div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div>`;
    if (st.aberta === si) {
      h += `<div class="muted peso" style="margin-top:6px">Peso do setor: ${editor ? `<input type="number" min="0" step="0.01" value="${pesos[si]}" data-peso="${si}">` : `<b>${pesos[si]}</b>`} %</div>`;
      s.itens.forEach((n, ii) => {
        const vals = cs.map(c => m[si + '|' + ii + '|' + c] || ''), cur = vals.every(v => v === vals[0]) ? vals[0] : null;
        h += `<div class="item"><span>${esc(n)}<br><b class="muted">${pI(m, si, ii, cs).toFixed(0)}%${cur === null ? ' • misto' : ''}</b></span><div class="lt">${['', 'A', 'B', 'C', 'D'].map(L => `<button class="${cur === L && L ? 'on c' + L : ''}" ${editor ? `data-marca="${si}|${ii}|${L}"` : 'disabled'} aria-label="${L || 'zerar'}">${L || '–'}</button>`).join('')}</div></div>`;
      });
    }
    h += '</div>';
  });
  const soma = pesos.reduce((a, b) => a + b, 0);
  return h + `<div class="card muted">Soma dos pesos: ${soma.toFixed(1)}%${Math.abs(soma - 100) > 0.5 ? ' (o ideal é 100%)' : ''}.</div>`;
}
function rO() {
  return `<div class="card editor"><b>Nova obra</b><input id="on" placeholder="Nome da obra"><input id="ob" type="number" min="1" inputmode="numeric" placeholder="Quantidade de blocos (cada bloco = 4 aptos)"><button class="btn" id="btnAddObra">Cadastrar obra</button>
</div>
  <div class="card"><b>Obras</b><table>${obras.map((o, i) => `<tr><td>${esc(o.nome)}<div class="muted">${o.blocos} blocos • ${o.blocos * 4} aptos • ${pO(mapa(o.nome), todasCols(o)).toFixed(1)}%</div></td><td class="editor" style="text-align:right;white-space:nowrap"><button class="pq" data-edobra="${i}">✏️ Editar</button> <button class="pq" data-delobra="${i}" aria-label="Excluir obra">🗑</button></td></tr>`).join('') || '<tr><td class="muted">Nenhuma obra.</td></tr>'}</table></div>`;
}
function rH() {
  return `<div class="card"><b>Histórico do cronograma</b><table>${hist.map(x => `<tr><td>${esc(x.texto)}<div class="muted">${fmtDH(x.criado_em)}${x.usuario ? ' • ' + esc(x.usuario) : ''}</div></td></tr>`).join('') || '<tr><td class="muted">Sem registros.</td></tr>'}</table></div>`;
}
function render() {
  if (st.obra) mem.gravar('obra', st.obra);
  if (aoVivo) copia.gravarDepois('cronograma', perfil, guardar);     // mantém a cópia com as últimas marcações
  $('app').innerHTML = st.tela === 'c' ? rC() : st.tela === 'o' ? rO() : rH();
}
async function go(t) {
  st.tela = t; document.querySelectorAll('.abas button').forEach(b => b.classList.toggle('on', b.dataset.tela === t));
  if (t === 'h') { $('app').innerHTML = '<div class="card">Carregando…</div>'; try { hist = ok(await sb.from('historico').select('*').eq('modulo', 'cronograma').order('criado_em', { ascending: false }).limit(300)); } catch (e) { toast(msg(e)); } }
  render();
}

// ===== EVENTOS =====
document.querySelectorAll('.abas button').forEach(b => b.onclick = () => go(b.dataset.tela));
$('app').addEventListener('click', e => {
  const b = e.target.closest('[data-bloco],[data-apt],[data-abre],[data-marca],[data-edobra],[data-delobra],#btnAddObra'); if (!b) return;
  const d = b.dataset;
  if (d.bloco) { st.bloco = +d.bloco; render(); }
  else if (d.apt) { st.apt = +d.apt; render(); }
  else if (d.abre) { st.aberta = st.aberta === +d.abre ? -1 : +d.abre; render(); }
  else if (d.marca) { const [si, ii, L] = d.marca.split('|'); marca(+si, +ii, L); }
  else if (d.edobra) editObra(+d.edobra);
  else if (d.delobra) delObra(+d.delobra);
  else if (b.id === 'btnAddObra') addObra();
});
$('app').addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'selObra') { st.obra = t.value; st.bloco = 0; render(); }
  else if (t.dataset.peso) mudaPeso(+t.dataset.peso, t.value);
});

(async () => {
  await TMC.abrirComCopia('cronograma', { carregar, guardar, restaurar, desenhar: (r, vivo) => { ({ perfil, editor } = r); aoVivo = vivo; render(); } });
})().catch(TMC.falhaAoAbrir);
</script>
</body>
</html>
