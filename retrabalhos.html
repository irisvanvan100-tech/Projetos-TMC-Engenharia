<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A8B6F">
<title>Retrabalhos | TMC Engenharia</title>
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="componentes.css">
<style>
.wrap{display:block;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:720px;margin:0 auto}
.listhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.listhead h2{margin:0}
.btnprev{border:1px solid var(--accent);background:var(--surface);color:var(--accent-strong);border-radius:6px;padding:8px 12px;font-weight:700;white-space:nowrap}
.fab .btn{max-width:720px;margin:0 auto;display:block}
.ovbar .baixar{background:#fff;color:#4a5a41}
.ovbar .fechar{background:#ffffff26;color:var(--accent-fg)}
.ovnote{max-width:794px;margin:0 auto 10px;font-size:12px;color:var(--muted);min-height:1em}
.col{min-width:0;display:flex;flex-direction:column;gap:14px}
.panel h2{font:700 15px/1.2 var(--display);margin:0 0 10px;letter-spacing:.01em}
label.f:first-of-type{margin-top:0}
input[type=text],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
textarea{min-height:72px;resize:vertical}
#desc{text-transform:uppercase}
#desc::placeholder{text-transform:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--chip);border-radius:20px;padding:7px 12px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
@media (max-width:480px){.row.pilha{flex-direction:column;gap:0}}
.btn{border:0;border-radius:6px;padding:11px 14px;font-weight:700;background:var(--accent);color:var(--accent-fg);width:100%;margin-top:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);font-weight:600}
.lista{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.item .n{font:700 13px/1.4 var(--display);color:var(--accent-strong);font-variant-numeric:tabular-nums}
.item .t{min-width:0}
.item .loc{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.item .d{font-weight:500}
.item .meta{font-size:12px;color:var(--muted)}
.item .acts{display:flex;gap:4px}
.item .acts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:12px}
.item.sure{border-color:var(--danger)}
.item .acts .del{color:var(--danger);border-color:var(--danger)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tags:empty{display:none}
.tg{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px}
.tg.orig{background:var(--chip);color:var(--muted)}
.tg.falta{background:#fbe7cf;color:#8a4b0f}
.vazio{color:var(--muted);font-size:13px;padding:6px 2px}
/* ----- prévia do PDF: papel sempre branco ----- */
.paper{--ink:#20241c;--soft:#646a5c;--rule:#d9d2c3;--band:#7A8B6F;--band2:#efe8dc; width:794px;min-height:1123px;margin:0 auto;background:#fff;color:var(--ink);box-shadow:0 2px 14px #0000002a; padding:44px 48px 40px;font:11.5px/1.45 var(--body);display:flex;flex-direction:column;color-scheme:light}
.p-head{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;border-bottom:3px solid var(--band);padding-bottom:14px}
.p-head img{width:150px}
.p-head h3{font:800 20px/1.1 var(--display);margin:0;letter-spacing:.02em;text-transform:uppercase}
.p-head .sub{color:var(--soft);margin-top:4px}
.p-info{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--rule);border-radius:6px;margin:14px 0 16px;overflow:hidden}
.p-info div{padding:7px 10px;border-right:1px solid var(--rule)}
.p-info div:last-child{border-right:0}
.p-info small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.p-info b{font-size:12.5px;font-variant-numeric:tabular-nums}
.p-grp{margin-bottom:12px;break-inside:avoid}
.p-grp h4{font:700 12px var(--display);text-transform:uppercase;letter-spacing:.06em;background:var(--band);color:#fff;margin:0;padding:6px 10px;border-radius:5px 5px 0 0}
.p-grp table{width:100%;border-collapse:collapse}
.p-grp th{font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);text-align:left;background:var(--band2);padding:5px 8px;border-bottom:1px solid var(--rule)}
.p-grp td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.p-grp td.num{width:28px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--soft)}
.p-grp td.com{width:86px;font-weight:600}
.p-grp td.resp{width:110px}
.p-grp td.mat{width:150px;color:var(--soft)}
.p-grp td.ok{width:34px;text-align:center}
.box{display:inline-block;width:12px;height:12px;border:1.5px solid var(--ink);border-radius:2px}
.p-sum{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px;break-inside:avoid}
.p-sum section{border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.p-sum h5{font:700 10px var(--display);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px;color:var(--soft)}
.p-sum li{display:flex;justify-content:space-between;gap:10px;padding:2px 0;border-bottom:1px dotted var(--rule)}
.p-sum ul{list-style:none;margin:0;padding:0}
.p-sum li span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.p-sign{margin-top:auto;padding-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:40px;break-inside:avoid}
.p-sign div{border-top:1px solid var(--ink);padding-top:4px;text-align:center;font-size:10px;color:var(--soft)}
.p-foot{display:flex;justify-content:space-between;font-size:9px;color:var(--soft);margin-top:14px;border-top:1px solid var(--rule);padding-top:6px}
.p-empty{color:var(--soft);text-align:center;padding:60px 0;border:1px dashed var(--rule);border-radius:6px}
#scaleBox{overflow:hidden}
#scaleBox{max-width:794px;margin:0 auto}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .2s}}
.paper{min-height:1123px;height:auto}
</style>
</head>
<body>
<p id="carregando">Carregando…</p>
<div id="sistema" class="oculto">
<header class="topo">
  <img class="marca" src="logo.jpg" alt="TMC Engenharia">
  <h1>Retrabalhos</h1>
  <span class="quem" id="quem"></span>
  <a class="btnlink" id="linkInicio" href="index.html" hidden>Início</a>
  <button id="btnSair" type="button">Sair</button>
</header>

<main class="wrap" id="wrap">
  <div class="col form">
    <section class="panel editor">
      <h2>Nova pendência</h2>
      <form id="frm" autocomplete="off">
        <div class="row">
          <div><label class="f" for="obra">Obra</label><input type="text" id="obra" list="obraList" autocomplete="off" spellcheck="false" autocapitalize="characters" placeholder="Escolha ou digite a obra"><datalist id="obraList"></datalist></div>
          <div><label class="f" for="apto">Local</label><input type="text" id="apto" list="aptoList" spellcheck="false" placeholder="Ex.: Bloco 1 • Apto 101"><datalist id="aptoList"></datalist></div>
        </div>
        <label class="f">Cômodo</label>
        <div class="chips" id="comodos"></div>
        <input type="text" id="outroCom" lang="pt-BR" spellcheck="true" autocorrect="on" autocapitalize="sentences" placeholder="Nome do cômodo" hidden>
        <label class="f" for="desc">Pendência *</label>
        <textarea id="desc" lang="pt-BR" spellcheck="true" autocorrect="on" autocapitalize="sentences" placeholder="Ex.: Rejunte falhando atrás do vaso sanitário"></textarea>
        <div class="row pilha">
          <div><label class="f" for="resp">Responsável *</label><input type="text" id="resp" list="respList" spellcheck="false" autocapitalize="words" placeholder="Ex.: Pedro (pedreiro)"><datalist id="respList"></datalist></div>
          <div><label class="f" for="mat">Material necessário *</label><input type="text" id="mat" lang="pt-BR" spellcheck="true" autocorrect="on" autocapitalize="sentences" placeholder="Ex.: Rejunte platina 1 kg"></div>
        </div>
        <p class="err" id="erro" role="alert"></p>
        <button class="btn" id="btnSalvar" type="submit">Salvar pendência</button>
        <button class="btn ghost" id="btnCancelar" type="button" hidden>Cancelar edição</button>
      </form>
    </section>

    <section class="panel">
      <div class="listhead"><h2 id="tituloLista">Pendências</h2><button class="btnprev" id="btnPrev2" type="button">📄 Ver prévia</button></div>
      <div class="lista" id="lista"></div>
    </section>
  </div>
</main>

<div class="fab"><button class="btn" id="btnPrev" type="button" style="margin-top:0">📄 Ver prévia e gerar PDF</button></div>
</div>

<div class="overlay" id="ov" role="dialog" aria-modal="true" aria-label="Prévia do PDF" hidden>
  <div class="ovbar"><b>Prévia do PDF</b><button class="baixar" id="btnBaixar" type="button">⬇ Baixar PDF</button><button class="fechar" id="btnFechar" type="button">Fechar</button></div>
  <div class="ovbody"><p class="ovnote" id="ovnote"></p>
    <div id="scaleBox"><div class="scaler" id="scaler"><article class="paper" id="paper"></article></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="comum.js"></script>
<script>
const APTS = ['101', '102', '201', '202'];
const COMODOS = ['WC', 'Sala', 'Varanda', 'Cozinha', 'Quarto 01', 'Suíte', 'Área de serviço', 'Outro'];
const mem = memoria('tmc_ret_');

let perfil, editor = false, itens = [], cronoObras = [], comodo = 'WC', editando = null, confirmar = null;

// ===== DADOS =====
async function carregar() {
  try { cronoObras = ok(await sb.from('crono_obras').select('nome,blocos').order('nome')); } catch (e) { cronoObras = []; }
  itens = await todos(() => sb.from('pendencias').select('*').order('id'));
}
// Obras = as do cronograma + as que já têm pendência (ex.: vindas de uma vistoria)
function listaObras() { return [...new Set([...cronoObras.map(o => o.nome), ...itens.map(x => x.obra)])].sort((a, b) => a.localeCompare(b, 'pt')); }
// Obra escolhida (o campo aceita escolher da lista ou digitar uma obra nova)
let obraSel = '';
function montaObras() {
  const l = listaObras();
  $('obraList').innerHTML = l.map(o => `<option value="${esc(o)}">`).join('');
  obraSel = obraSel || (l.includes(mem.ler('obra')) ? mem.ler('obra') : l[0] || '');
  $('obra').value = obraSel;
  locais();
}
function locais() {
  const nome = obraSel, o = cronoObras.find(x => x.nome === nome), l = ['Área comum'];
  if (o) for (let b = 1; b <= o.blocos; b++) APTS.forEach(a => l.push(`Bloco ${b} • Apto ${a}`));
  itens.filter(x => x.obra === nome && x.local && !l.includes(x.local)).forEach(x => l.push(x.local));
  $('aptoList').innerHTML = [...new Set(l)].map(x => `<option value="${esc(x)}">`).join('');
  if (!$('apto').value) $('apto').value = mem.ler('local') || (o ? 'Bloco 1 • Apto 101' : '');
}

// ===== FORMULÁRIO =====
function chips() {
  $('comodos').innerHTML = COMODOS.map(c => `<button type="button" aria-pressed="${c === comodo}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('outroCom').hidden = comodo !== 'Outro';
}
$('comodos').onclick = e => { const b = e.target.closest('button'); if (!b) return; comodo = b.dataset.c; chips(); if (comodo === 'Outro') $('outroCom').focus(); };
// Ao tocar no campo, ele fica vazio para mostrar a lista inteira; se sair sem escolher, volta a obra de antes
$('obra').onfocus = () => { $('obra').placeholder = obraSel || 'Escolha ou digite a obra'; $('obra').value = ''; };
$('obra').onblur = () => { if (!$('obra').value.trim()) $('obra').value = obraSel; };
$('obra').onchange = () => {
  const digitado = $('obra').value.trim(); if (!digitado) return;
  // obra que já existe (mesmo com maiúsculas/minúsculas diferentes) é reaproveitada; obra nova fica em maiúsculas
  obraSel = listaObras().find(o => o.toLowerCase() === digitado.toLowerCase()) || UP(digitado);
  $('obra').value = obraSel; mem.gravar('obra', obraSel); $('apto').value = ''; locais(); render();
};
['desc', 'resp', 'mat'].forEach(id => $(id).addEventListener('input', () => $(id).classList.remove('falta')));

function limpaForm() {
  editando = null; $('desc').value = ''; $('mat').value = '';
  $('btnSalvar').textContent = 'Salvar pendência'; $('btnCancelar').hidden = true;
}
$('btnCancelar').onclick = () => { limpaForm(); render(); };
$('frm').onsubmit = async e => {
  e.preventDefault();
  const com = comodo === 'Outro' ? $('outroCom').value.trim() : comodo, desc = UP($('desc').value.trim());
  if (!obraSel) { $('obra').classList.add('falta'); return $('erro').textContent = 'Escolha ou digite a obra.'; }
  $('obra').classList.remove('falta');
  if (!com) return $('erro').textContent = 'Escreva o nome do cômodo.';
  const faltando = [];
  if (!desc) faltando.push(['desc', 'a pendência']);
  if (!$('resp').value.trim()) faltando.push(['resp', 'o responsável']);
  if (!$('mat').value.trim()) faltando.push(['mat', 'o material necessário']);
  ['desc', 'resp', 'mat'].forEach(id => $(id).classList.toggle('falta', faltando.some(f => f[0] === id)));
  if (faltando.length) {
    const n = faltando.map(f => f[1]);
    $('erro').textContent = 'Preencha ' + (n.length > 1 ? n.slice(0, -1).join(', ') + ' e ' + n.at(-1) : n[0]) + '.';
    return $(faltando[0][0]).focus();
  }
  $('erro').textContent = '';
  const dados = { obra: obraSel, local: $('apto').value.trim() || 'Área comum', comodo: com, descricao: desc, responsavel: $('resp').value.trim(), material: $('mat').value.trim() };
  const b = $('btnSalvar'); b.disabled = true;
  try {
    if (editando) { ok(await sb.from('pendencias').update(dados).eq('id', editando)); Object.assign(itens.find(x => x.id === editando), dados); }
    else itens.push(ok(await sb.from('pendencias').insert({ ...dados, criado_por: perfil.nome }).select().single()));
    mem.gravar('local', dados.local); limpaForm(); montaObras(); render(); $('desc').focus(); toast('Pendência salva.');
  } catch (err) { $('erro').textContent = 'Não foi possível salvar: ' + msg(err); }
  b.disabled = false;
};

$('lista').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  const id = +b.dataset.id, it = itens.find(x => x.id === id);
  if (b.dataset.a === 'edit') {
    editando = id; obraSel = it.obra; $('obra').value = obraSel; locais(); $('apto').value = it.local;
    if (COMODOS.includes(it.comodo)) comodo = it.comodo; else { comodo = 'Outro'; $('outroCom').value = it.comodo; }
    chips(); $('desc').value = it.descricao; $('resp').value = it.responsavel; $('mat').value = it.material;
    $('btnSalvar').textContent = 'Salvar alteração'; $('btnCancelar').hidden = false;
    render(); $('frm').scrollIntoView({ behavior: 'smooth', block: 'start' }); $('desc').focus({ preventScroll: true });
  } else if (b.dataset.a === 'del') { confirmar = id; render(); }
  else if (b.dataset.a === 'nao') { confirmar = null; render(); }
  else if (b.dataset.a === 'sim') {
    try { ok(await sb.from('pendencias').delete().eq('id', id)); itens = itens.filter(x => x.id !== id); confirmar = null; if (editando === id) limpaForm(); render(); toast('Pendência apagada.'); }
    catch (err) { toast('Não foi possível apagar: ' + msg(err)); }
  }
};

// ===== LISTA E PRÉVIA =====
const obraAtual = () => obraSel;
const daObra = () => itens.filter(x => x.obra === obraAtual());
function ordem(a, b) {
  const la = a.local === 'Área comum' ? 'zz' : a.local, lb = b.local === 'Área comum' ? 'zz' : b.local;
  const ca = COMODOS.indexOf(a.comodo), cb = COMODOS.indexOf(b.comodo);
  return la.localeCompare(lb, 'pt', { numeric: true }) || (ca < 0 ? 99 : ca) - (cb < 0 ? 99 : cb) || a.id - b.id;
}
const incompleta = x => !x.responsavel || !x.material;
function render() {
  const lista = daObra().sort(ordem);
  $('tituloLista').textContent = `Pendências de ${obraAtual() || '—'} (${lista.length})`;
  const nums = new Map(lista.map((x, i) => [x.id, i + 1]));
  $('lista').innerHTML = lista.length ? lista.map(x => `<div class="item ${confirmar === x.id ? 'sure' : ''}">
      <span class="n">${String(nums.get(x.id)).padStart(2, '0')}</span>
      <div class="t"><div class="loc">${esc(x.local)} • ${esc(x.comodo)}</div><div class="d">${esc(UP(x.descricao))}</div>
        <div class="meta">${x.responsavel ? '👷 ' + esc(x.responsavel) : 'sem responsável'}${x.material ? ' • 🧱 ' + esc(x.material) : ''}</div>
        <div class="tags">${x.origem === 'vistoria' ? '<span class="tg orig">📋 da vistoria</span>' : ''}${incompleta(x) ? `<span class="tg falta">⚠ a completar: ${[!x.responsavel && 'responsável', !x.material && 'material'].filter(Boolean).join(' e ')}</span>` : ''}</div></div>
      <div class="acts editor">${confirmar === x.id
        ? `<button data-a="sim" data-id="${x.id}" class="del">Apagar</button><button data-a="nao" data-id="${x.id}">Não</button>`
        : `<button data-a="edit" data-id="${x.id}" aria-label="Editar">Editar</button><button data-a="del" data-id="${x.id}" aria-label="Apagar">✕</button>`}</div>
    </div>`).join('') : '<p class="vazio">Nenhuma pendência nesta obra ainda.</p>';
  $('respList').innerHTML = [...new Set(itens.map(x => x.responsavel).filter(Boolean))].map(r => `<option value="${esc(r)}">`).join('');
}
// materiais iguais viram uma linha só: "Rejunte platina 1 kg × 3"
function matsAgrupados(lista) { const m = new Map(); lista.filter(x => x.material).forEach(x => { const key = x.material.trim().toLocaleLowerCase('pt-BR'); const c = m.get(key) || { t: x.material.trim(), n: 0 }; c.n++; m.set(key, c); }); return [...m.values()]; }
function grupos(lista) { const g = {}; lista.forEach(x => (g[x.local] ??= []).push(x)); return g; }
function papel() {
  const lista = daObra().sort(ordem), nums = new Map(lista.map((x, i) => [x.id, i + 1]));
  const hoje = new Date().toLocaleDateString('pt-BR'), g = grupos(lista);
  const porResp = {}; lista.forEach(x => { const r = x.responsavel || 'Sem responsável'; porResp[r] = (porResp[r] || 0) + 1; });
  const mats = matsAgrupados(lista);
  $('paper').innerHTML = `
    <div class="p-head"><img src="logo.jpg" alt="TMC Engenharia"><div><h3>Lista de pendências • Retrabalhos</h3><div class="sub">Vistoria de entrega — itens a corrigir antes da liberação</div></div></div>
    <div class="p-info"><div><small>Obra</small><b>${esc(obraAtual())}</b></div><div><small>Data</small><b>${hoje}</b></div><div><small>Locais</small><b>${Object.keys(g).length}</b></div><div><small>Pendências</small><b>${lista.length}</b></div></div>
    ${lista.length ? Object.entries(g).map(([loc, xs]) => `<div class="p-grp"><h4>${esc(loc)}</h4><table>
      <thead><tr><th>Nº</th><th>Cômodo</th><th>Pendência</th><th>Responsável</th><th>Material</th><th>OK</th></tr></thead>
      <tbody>${xs.map(x => `<tr><td class="num">${String(nums.get(x.id)).padStart(2, '0')}</td><td class="com">${esc(x.comodo)}</td><td>${esc(UP(x.descricao))}</td><td class="resp">${esc(x.responsavel) || '—'}</td><td class="mat">${esc(x.material) || '—'}</td><td class="ok"><span class="box"></span></td></tr>`).join('')}</tbody></table></div>`).join('')
      : '<div class="p-empty">As pendências que você salvar aparecem aqui.</div>'}
    ${lista.length ? `<div class="p-sum">
      <section><h5>Por responsável</h5><ul>${Object.entries(porResp).sort((a, b) => b[1] - a[1]).map(([r, n]) => `<li><span>${esc(r)}</span><span>${n}</span></li>`).join('')}</ul></section>
      <section><h5>Materiais a providenciar</h5><ul>${mats.length ? mats.map(m => `<li><span>${esc(m.t)}</span><span>${m.n > 1 ? '× ' + m.n : ''}</span></li>`).join('') : '<li><span>Nenhum material informado</span><span></span></li>'}</ul></section>
    </div>` : ''}
    <div class="p-sign"><div>Responsável técnico — TMC Engenharia</div><div>Conferido em ____/____/________</div></div>
    <div class="p-foot"><span>TMC Engenharia • Retrabalhos</span><span>Página 1</span></div>`;
  const inc = lista.filter(incompleta).length;
  $('ovnote').textContent = inc ? `⚠ ${inc} ${inc === 1 ? 'pendência está' : 'pendências estão'} sem responsável ou material (aparecem com “—” no PDF). Complete pelo Editar antes de gerar.` : '';
  ajusta();
}
const ajusta = () => encaixarFolha($('scaleBox'), $('scaler'), 794);
addEventListener('resize', ajusta);
function abrePrevia() { papel(); abrirJanela($('ov')); ajusta(); $('btnFechar').focus(); }

// ===== PDF (várias páginas se precisar) =====
async function gerarPdf() {
  const jsPDF = await libsPdf('jspdf', 'autotable'), doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const OLIVA = [122, 139, 111], BEGE = [239, 232, 220], TINTA = [32, 36, 28], SUAVE = [100, 106, 92], W = 210, M = 14;
  const lista = daObra().sort(ordem), nums = new Map(lista.map((x, i) => [x.id, i + 1])), g = grupos(lista);
  try { doc.addImage(await logoPdf(), 'JPEG', M, 10, 38, 23.6); } catch (e) {}
  doc.setTextColor(...TINTA); doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text('LISTA DE PENDÊNCIAS • RETRABALHOS', 58, 20);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...SUAVE); doc.text('Vistoria de entrega — itens a corrigir antes da liberação', 58, 26);
  doc.setDrawColor(...OLIVA); doc.setLineWidth(0.9); doc.line(M, 36, W - M, 36);
  const info = [['OBRA', obraAtual()], ['DATA', new Date().toLocaleDateString('pt-BR')], ['LOCAIS', String(Object.keys(g).length)], ['PENDÊNCIAS', String(lista.length)]];
  const cw = (W - 2 * M) / 4; doc.setLineWidth(0.2); doc.setDrawColor(217, 210, 195); doc.roundedRect(M, 40, W - 2 * M, 12, 1.5, 1.5);
  info.forEach(([t, v], i) => { const x = M + i * cw; if (i) doc.line(x, 40, x, 52); doc.setFontSize(6.5); doc.setTextColor(...SUAVE); doc.text(t, x + 3, 44.5); doc.setFontSize(9.5); doc.setTextColor(...TINTA); doc.setFont('helvetica', 'bold'); doc.text(doc.splitTextToSize(v, cw - 6)[0], x + 3, 49.5); doc.setFont('helvetica', 'normal'); });
  let y = 57;
  Object.entries(g).forEach(([loc, xs]) => {
    doc.autoTable({
      startY: y, margin: { left: M, right: M, top: 14, bottom: 16 }, theme: 'plain', pageBreak: xs.length <= 6 ? 'avoid' : 'auto', rowPageBreak: 'avoid',
      head: [[{ content: UP(loc), colSpan: 6, styles: { fillColor: OLIVA, textColor: 255, fontStyle: 'bold', fontSize: 9 } }],
             ['Nº', 'CÔMODO', 'PENDÊNCIA', 'RESPONSÁVEL', 'MATERIAL', 'OK']],
      body: xs.map(x => [String(nums.get(x.id)).padStart(2, '0'), x.comodo, UP(x.descricao), x.responsavel || '—', x.material || '—', '']),
      styles: { fontSize: 8.5, cellPadding: 1.8, textColor: TINTA, lineColor: [217, 210, 195], lineWidth: { bottom: 0.2 }, valign: 'top' },
      headStyles: { fillColor: BEGE, textColor: SUAVE, fontSize: 6.8, fontStyle: 'bold' },
      columnStyles: { 0: { cellWidth: 9, fontStyle: 'bold', textColor: SUAVE }, 1: { cellWidth: 24, fontStyle: 'bold' }, 3: { cellWidth: 30 }, 4: { cellWidth: 38, textColor: SUAVE }, 5: { cellWidth: 10, halign: 'center' } },
      didDrawCell: d => { if (d.section === 'body' && d.column.index === 5) { doc.setDrawColor(...TINTA); doc.setLineWidth(0.35); doc.rect(d.cell.x + d.cell.width / 2 - 1.8, d.cell.y + 1.6, 3.6, 3.6); } }
    });
    y = doc.lastAutoTable.finalY + 5;
  });
  // resumos lado a lado
  const porResp = {}; lista.forEach(x => { const r = x.responsavel || 'Sem responsável'; porResp[r] = (porResp[r] || 0) + 1; });
  const mats = matsAgrupados(lista).map(m => [m.t, m.n > 1 ? '× ' + m.n : '']);
  if (y > 250) { doc.addPage(); y = 16; }
  const meia = (W - 2 * M - 6) / 2, inicio = y, pag = doc.getNumberOfPages();
  const resumo = (titulo, body, left, cols) => doc.autoTable({ startY: inicio, margin: { left, right: W - left - meia, bottom: 16 }, theme: 'plain', tableWidth: meia,
    head: [[{ content: titulo, colSpan: cols, styles: { textColor: SUAVE, fontSize: 7, fontStyle: 'bold' } }]], body,
    styles: { fontSize: 8.5, cellPadding: 1.4, textColor: TINTA, lineColor: [217, 210, 195], lineWidth: { bottom: 0.15 } }, columnStyles: { 1: { halign: 'right', fontStyle: 'bold', cellWidth: 12 } } });
  resumo('POR RESPONSÁVEL', Object.entries(porResp).sort((a, b) => b[1] - a[1]).map(([r, n]) => [r, String(n)]), M, 2);
  const fim1 = doc.lastAutoTable.finalY, pag1 = doc.getNumberOfPages();
  doc.setPage(pag);
  resumo('MATERIAIS A PROVIDENCIAR', mats.length ? mats : [['Nenhum material informado', '']], M + meia + 6, 2);
  y = Math.max(fim1, doc.lastAutoTable.finalY) + 22; doc.setPage(Math.max(pag1, doc.getNumberOfPages()));
  if (y > 275) { doc.addPage(); y = 40; }
  doc.setDrawColor(...TINTA); doc.setLineWidth(0.3); doc.setFontSize(7.5); doc.setTextColor(...SUAVE);
  doc.line(M, y, M + 80, y); doc.text('Responsável técnico — TMC Engenharia', M + 40, y + 4, { align: 'center' });
  doc.line(W - M - 80, y, W - M, y); doc.text('Conferido em ____/____/________', W - M - 40, y + 4, { align: 'center' });
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(7); doc.setTextColor(...SUAVE); doc.text('TMC Engenharia • Retrabalhos • ' + obraAtual(), M, 290); doc.text(`Página ${i} de ${n}`, W - M, 290, { align: 'right' }); }
  return doc;
}
$('btnBaixar').onclick = async () => {
  const b = $('btnBaixar'); b.disabled = true; b.textContent = 'Gerando…';
  try { const nome = nomeArquivo('retrabalhos', obraAtual(), hojeISO()); (await gerarPdf()).save(nome); }
  catch (e) { toast('Não foi possível gerar o PDF: ' + msg(e)); }
  b.disabled = false; b.textContent = '⬇ Baixar PDF';
};
