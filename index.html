<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMC Engenharia | Sistema</title>
<style>
:root{--bege:#E3C4A8;--oliva:#7A8B6F;--fundo:#F3EFE6;--tinta:#2f352b;--borda:#d8cfbf;--erro:#a3392a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--fundo);color:var(--tinta);font:16px/1.45 "Segoe UI",system-ui,sans-serif}
.cartao{width:100%;max-width:420px;background:#fff;border:1px solid var(--borda);border-radius:16px;padding:24px 28px 28px;text-align:center;box-shadow:0 6px 24px rgba(47,53,43,.08)}
.logo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 12px}
h1{font-size:20px;margin:0 0 14px}
label{display:block;text-align:left;font-weight:600;font-size:14px;margin:12px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--borda);border-radius:8px;font:inherit}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:var(--oliva);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--oliva);border:1px solid var(--oliva)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--tinta);outline-offset:2px}
.link{display:inline-block;margin-top:12px;font-size:14px;color:var(--oliva);background:none;border:0;width:auto;padding:0;text-decoration:underline;font-weight:400}
.erro{color:var(--erro);min-height:1.2em;margin:10px 0 0;font-size:14px}
.modulo{display:block;text-align:left;text-decoration:none;color:inherit;border:1px solid var(--borda);border-left:6px solid var(--bege);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.modulo:hover{background:var(--fundo)}
.modulo b{display:block;font-size:17px}
.modulo small{color:#6b7163}
.oculto{display:none!important}
</style>
</head>
<body>
<main class="cartao">
  <img class="logo" src="logo.jpg" alt="TMC Engenharia">

  <section id="entrada" class="oculto">
    <h1>Entrar no sistema</h1>
    <form id="form">
      <label id="lbEmail">E-mail<input id="email" type="email" autocomplete="username"></label>
      <label>Senha<input id="senha" type="password" autocomplete="current-password" required></label>
      <button>Entrar</button>
      <button type="button" class="link" id="alterna">Acesso só com senha (visualização)</button>
      <p class="erro" id="erro" role="alert"></p>
    </form>
  </section>

  <section id="menu" class="oculto">
    <h1 id="ola"></h1>
    <div id="listaModulos"></div>
    <button class="sec" data-sair>Sair</button>
  </section>

  <section id="semAcesso" class="oculto">
    <h1>Sem acesso</h1>
    <p>Seu usuário ainda não tem permissão para nenhuma página. Fale com o administrador do sistema.</p>
    <button class="sec" data-sair>Sair</button>
  </section>

  <p id="carregando">Carregando…</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const NIVEL = { ver: 'Somente visualização', editar: 'Visualizar e editar' };
let soSenha = false;

function mostrar(id) {
  $('carregando').classList.add('oculto');
  ['entrada', 'menu', 'semAcesso'].forEach(s => $(s).classList.toggle('oculto', s !== id));
}

// Decide para onde o usuário vai, conforme as permissões dele
async function rotear() {
  try {
    if (!(await TMC.sessao())) return mostrar('entrada');
    const p = await TMC.perfil();
    const modulos = TMC.modulos(p);
    if (!modulos.length) return mostrar('semAcesso');
    if (modulos.length === 1) return location.replace(TMC.MODULOS[modulos[0]].pagina);
    $('ola').textContent = 'Olá, ' + p.nome;
    $('listaModulos').innerHTML = modulos.map(m => `<a class="modulo" href="${TMC.MODULOS[m].pagina}"><b>${TMC.MODULOS[m].titulo}</b><small>${NIVEL[p[m]] || ''}</small></a>`).join('');
    mostrar('menu');
  } catch (e) { mostrar('entrada'); $('erro').textContent = 'Erro: ' + (e.message || e); }
}

$('alterna').onclick = () => {
  soSenha = !soSenha;
  $('lbEmail').classList.toggle('oculto', soSenha);
  $('alterna').textContent = soSenha ? 'Entrar com e-mail e senha' : 'Acesso só com senha (visualização)';
};
$('form').onsubmit = async e => {
  e.preventDefault(); $('erro').textContent = '';
  const email = soSenha ? TMC_CONFIG.LEITOR_EMAIL : $('email').value.trim();
  if (!email) return;
  const { error } = await sb.auth.signInWithPassword({ email, password: $('senha').value });
  if (error) { $('erro').textContent = soSenha ? 'Senha incorreta.' : 'E-mail ou senha incorretos.'; return; }
  $('senha').value = ''; rotear();
};
document.querySelectorAll('[data-sair]').forEach(b => b.onclick = async () => { await sb.auth.signOut(); location.reload(); });
rotear();
</script>
</body>
</html>
