<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A8B6F">
<title>TMC Engenharia | Sistema</title>
<link rel="stylesheet" href="estilo.css">
<style>
:root{--olivaesc:#4f5d46;--olivaclaro:#e8ede3;--suave:#6b7163;--alerta:#a3392a}
a{color:inherit;text-decoration:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lim{max-width:1080px;margin:0 auto}

/* login */
.entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.cartao{width:100%;max-width:420px;background:#fff;border:1px solid var(--borda);border-radius:16px;padding:24px 28px 28px;text-align:center;box-shadow:0 6px 24px rgba(47,53,43,.08)}
.cartao .logo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 12px}
.cartao h1{font-size:20px;margin:0 0 14px}
.cartao label{display:block;text-align:left;font-weight:600;font-size:14px;margin:12px 0 4px}
.cartao input{width:100%;padding:11px;border:1px solid var(--borda);border-radius:8px}
.cartao button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:8px;background:var(--oliva);color:#fff;font-weight:600}
.cartao button.sec{background:transparent;color:var(--oliva);border:1px solid var(--oliva)}
.cartao .link{display:inline-block;margin-top:12px;font-size:14px;color:var(--oliva);background:none;border:0;width:auto;padding:0;text-decoration:underline;font-weight:400}
.erro{color:var(--alerta);min-height:1.2em;margin:10px 0 0;font-size:14px}

/* painel */
.topo2{background:var(--oliva);color:#fff;padding-block:18px 64px}
.topo2 .lim{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topo2 .marca{height:40px;background:#fff;border-radius:8px;padding:3px 8px}
.topo2 h1{margin:0;font-size:22px;flex:1;min-width:200px}
.topo2 small{display:block;font-size:13px;opacity:.85;font-weight:400}
.topo2 .sair{background:#ffffff26;border:0;color:#fff;border-radius:8px;padding:8px 14px}
.obras{display:flex;gap:10px;overflow-x:auto;margin-top:-48px;padding-bottom:4px}
.obra{display:flex;align-items:center;gap:12px;border:1.5px solid transparent;border-radius:14px;padding:10px 14px;background:#fff;min-width:230px;text-align:left;box-shadow:0 4px 14px #2f352b14}
.obra[aria-pressed="true"]{border-color:var(--oliva);box-shadow:0 0 0 2px var(--oliva),0 4px 14px #2f352b14}
.obra b{display:block}
.obra small{color:var(--suave)}
.anel{--p:0;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--oliva) calc(var(--p)*1%),#e6e0d4 0);display:grid;place-items:center;flex:none}
.anel span{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.semobra{margin-top:-48px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px 14px;min-width:0}
.kpi small{display:block;color:var(--suave);font-size:12px}
.kpi b{display:block;font-size:22px;color:var(--olivaesc)}
.kpi i{font-style:normal;font-size:12px;color:var(--suave)}
.kpi.alerta b{color:var(--alerta)}
.kpi .bar{height:5px;background:var(--olivaclaro);border-radius:4px;margin-top:6px;overflow:hidden}
.kpi .bar span{display:block;height:100%;background:var(--oliva);transition:width .4s}
.cont{display:flex;align-items:center;gap:12px;background:var(--olivaclaro);border:1px solid #cfd8c6;border-radius:12px;padding:12px 14px;margin:14px 0 4px}
.cont div{flex:1;min-width:0}
.cont small{display:block;color:var(--suave);font-size:12px}
.cont .seta{font-weight:700;color:var(--olivaesc);white-space:nowrap}
.etapas{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-block:18px 36px}
.etapa h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--suave)}
.etapa h3 i{width:22px;height:22px;border-radius:50%;background:var(--tinta);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}
.card{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px;margin-bottom:8px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #2f352b14;border-color:var(--oliva)}
.card .ic{width:40px;height:40px;border-radius:10px;background:var(--olivaclaro);color:var(--olivaesc);display:grid;place-items:center;flex:none}
.card div{flex:1;min-width:0}
.card b{display:block}
.card small{display:block;color:var(--suave);font-size:12.5px;min-height:1.2em}
.bd{background:var(--alerta);color:#fff;border-radius:20px;font-size:11px;font-weight:700;padding:1px 7px;white-space:nowrap}
.nivel{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;background:#f3efe6;border:1px solid var(--borda);color:var(--suave);white-space:nowrap}
.esperando{color:#b9b3a6!important}
@media (max-width:900px){.etapas{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.etapas{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.card,.kpi .bar span{transition:none}}
</style>
</head>
<body>
<p id="carregando">Carregando…</p>

<div class="entrada" id="entrada" hidden>
  <main class="cartao">
    <img class="logo" src="logo.jpg" alt="TMC Engenharia">
    <section id="login">
      <h1>Entrar no sistema</h1>
      <form id="form">
        <label id="lbEmail">E-mail<input id="email" type="email" autocomplete="username"></label>
        <label>Senha<input id="senha" type="password" autocomplete="current-password" required></label>
        <button>Entrar</button>
        <button type="button" class="link" id="alterna">Acesso só com senha (visualização)</button>
        <p class="erro" id="erro" role="alert"></p>
      </form>
    </section>
    <section id="semAcesso" hidden>
      <h1>Sem acesso</h1>
      <p id="semAcessoTxt">Seu usuário ainda não tem permissão para nenhuma página. Fale com o administrador do sistema.</p>
      <button class="sec" data-sair type="button">Sair</button>
    </section>
  </main>
</div>

<div id="painel" hidden>
  <header class="topo2 gut"><div class="lim"><img class="marca" src="logo.jpg" alt="TMC Engenharia">
    <h1 id="ola"></h1><button class="sair" data-sair type="button">Sair</button></div></header>
  <main class="gut"><div class="lim">
    <div class="obras" id="obras"></div>
    <div class="kpis" id="kpis"></div>
    <a class="cont" id="cont" hidden></a>
    <div class="etapas" id="etapas"></div>
  </div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="comum.js"></script>
<script src="setores.js"></script>
<script>
// ===== LOGIN =====
let soSenha = false;
function tela(id) { $('carregando')?.remove(); $('entrada').hidden = id === 'painel'; $('painel').hidden = id !== 'painel'; $('login').hidden = id !== 'login'; $('semAcesso').hidden = id !== 'semAcesso'; }
$('alterna').onclick = () => {
  soSenha = !soSenha; $('lbEmail').hidden = soSenha;
  $('alterna').textContent = soSenha ? 'Entrar com e-mail e senha' : 'Acesso só com senha (visualização)';
};
// mensagem clara para cada motivo de erro no login
function motivo(e) {
  const m = (e.message || '').toLowerCase();
  if (m.includes('not confirmed')) return 'E-mail ainda não confirmado. Peça ao administrador para confirmar o seu usuário.';
  if (m.includes('rate') || m.includes('too many')) return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if (m.includes('fetch') || m.includes('network')) return 'Sem internet. Confira a conexão e tente de novo.';
  return soSenha ? 'Senha incorreta.' : 'E-mail ou senha incorretos.';
}
$('form').onsubmit = async e => {
  e.preventDefault(); $('erro').textContent = '';
  const email = soSenha ? TMC_CONFIG.LEITOR_EMAIL : $('email').value.trim();
  if (!email) return;
  const { error } = await sb.auth.signInWithPassword({ email, password: $('senha').value });
  if (error) return $('erro').textContent = motivo(error);
  $('senha').value = ''; rotear();
};
document.querySelectorAll('[data-sair]').forEach(b => b.onclick = async () => { await sb.auth.signOut(); location.reload(); });

// ===== PAINEL =====
const IC = {
  folha: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 12"/>',
  cronograma: '<path d="M3 4v16h18"/><path d="M7 8h7M7 12h11M7 16h5"/>',
  estoque: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  vistoria: '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3h6v3H9zM9 12l2 2 4-4M9 17h6"/>',
  retrabalhos: '<path d="M14.7 6.3a4 4 0 0 0 5 5L21 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L18 10l1.7-1.3a4 4 0 0 0-5-5L16 5z"/><path d="M3 21l6-6"/>',
  entrega: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/>',
  material: '<path d="M2 16V6h11v10M13 9h5l4 4v3h-9"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/>',
  prestacao: '<path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/>'
};
const svg = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const ETAPAS = { Planejar: ['cronograma', 'estoque', 'material'], Executar: ['folha', 'retrabalhos'], Entregar: ['vistoria', 'entrega'], Financeiro: ['prestacao'] };
const mem = memoria('tmc_inicio_');
const reais = n => 'R$ ' + Math.round(n).toLocaleString('pt-BR');
const pct = n => n.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const mesma = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
const ola = () => { const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; };
let P, mods = [], obras = [], obraSel = '', D = {};     // D = dados carregados de cada módulo
const falhou = new Set();                               // módulos cuja leitura deu erro (ex.: sem internet)
const pode = m => mods.includes(m);

// Cada leitura só acontece se o usuário tem acesso ao módulo (e uma falha não derruba as outras)
const LEITURAS = {
  async cronograma() {
    const [st, ps] = await Promise.all([todos(() => sb.from('crono_status').select('obra,setor,item,apto,nivel')), todos(() => sb.from('crono_pesos').select('*'))]);
    return { st, ps };
  },
  material: () => todos(() => sb.from('material_entregas').select('obra,quantidade,preco').is('pago_em', null)),
  retrabalhos: () => todos(() => sb.from('pendencias').select('obra,responsavel,material')),
  estoque: async () => {
    const [mv, mo, pa] = await Promise.all([todos(() => sb.from('movimentos').select('obra,material,tipo,quantidade,preco')), todos(() => sb.from('modelo_bloco').select('material,quantidade,perda')).catch(() => []),
      sb.from('parametros').select('valor').eq('chave', 'perda_padrao').maybeSingle().then(r => r.data?.valor ?? 5)]);
    return { mv, mo, perda: +pa };
  },
  vistoria: () => todos(() => sb.from('vistorias').select('obra,total_nc,criado_em')),
  entrega: () => todos(() => sb.from('entregas_chaves').select('obra,data_entrega').order('data_entrega', { ascending: false })),
  async folha() {
    const q = ok(await sb.from('quinzenas').select('*').order('data_inicio', { ascending: false }).limit(1).maybeSingle()); if (!q) return null;
    const f = ok(await sb.from('funcionarios_quinzena').select('id,valor_diaria').eq('quinzena_id', q.id));
    const pts = f.length ? ok(await sb.from('pontos').select('funcionario_id,valor').in('funcionario_id', f.map(x => x.id))) : [];
    const diaria = Object.fromEntries(f.map(x => [x.id, +x.valor_diaria]));
    return { q, func: f.length, total: pts.reduce((a, p) => a + p.valor * diaria[p.funcionario_id], 0) };
  },
  async prestacao() {
    const [c, l] = await Promise.all([sb.from('caixa').select('recebido').eq('id', 1).maybeSingle().then(r => +(r.data?.recebido || 0)), todos(() => sb.from('lancamentos').select('valor,comprovante'))]);
    return { saldo: c - l.reduce((a, x) => a + +x.valor, 0), sem: l.filter(x => !x.comprovante).length };
  }
};

// andamento da obra (mesma conta do cronograma)
const VAL = { A: 25, B: 50, C: 75, D: 100 };
function andamento(nome) {
  const c = D.cronograma, o = obras.find(x => x.nome === nome); if (!c || !o || !o.blocos) return null;
  const m = {}; c.st.filter(s => s.obra === nome).forEach(s => m[s.setor + '|' + s.item + '|' + s.apto] = VAL[s.nivel] || 0);
  let pesos = SETORES.map((_, i) => +(c.ps.find(p => p.setor === i)?.peso || 0)); if (!pesos.some(Boolean)) pesos = SETORES.map(() => 1);
  const aptos = o.blocos * 4, tot = pesos.reduce((a, b) => a + b, 0);
  return SETORES.reduce((a, s, si) => a + pesos[si] * s.itens.reduce((b, _, ii) => { let x = 0; for (let ap = 0; ap < aptos; ap++) x += m[si + '|' + ii + '|' + ap] || 0; return b + x / aptos; }, 0) / s.itens.length, 0) / tot;
}
// números de cada módulo para a obra escolhida (null = ainda carregando)
function numeros() {
  const o = obraSel, r = {};
  if (D.cronograma) r.cronograma = andamento(o);
  if (D.material) { const l = D.material.filter(x => mesma(x.obra, o)); r.material = { v: l.reduce((a, x) => a + x.quantidade * x.preco, 0), n: l.length }; }
  if (D.retrabalhos) { const l = D.retrabalhos.filter(x => mesma(x.obra, o)); r.retrabalhos = { n: l.length, inc: l.filter(x => !x.responsavel || !x.material).length }; }
  if (D.estoque) {
    const ob = obras.find(x => x.nome === o), comp = {}, l = D.estoque.mv.filter(x => mesma(x.obra, o));
    l.forEach(x => { if (x.tipo === 'E') comp[x.material] = (comp[x.material] || 0) + +x.quantidade; });
    const falta = ob?.blocos ? D.estoque.mo.filter(it => Math.ceil(it.quantidade * ob.blocos * (1 + (it.perda ?? D.estoque.perda) / 100) - 1e-9) > (comp[it.material] || 0)).length : null;
    r.estoque = { comprado: l.filter(x => x.tipo === 'E').reduce((a, x) => a + x.quantidade * (x.preco || 0), 0), falta };
  }
  if (D.vistoria) { const l = D.vistoria.filter(x => mesma(x.obra, o)); r.vistoria = { n: l.length, nc: l.reduce((a, x) => a + (x.total_nc || 0), 0) }; }
  if (D.entrega) { const l = D.entrega.filter(x => mesma(x.obra, o)); r.entrega = { n: l.length, ult: l[0]?.data_entrega }; }
  if (D.folha !== undefined) r.folha = D.folha;
  if (D.prestacao) r.prestacao = D.prestacao;
  return r;
}
// textos de cada cartão: [linha 1, linha 2, bolinha de pendência]
function textos(k, n) {
  if (falhou.has(k)) return ['Não foi possível carregar os números', '', 0];
  const x = n[k]; if (x === undefined) return ['carregando…', '', 0];
  switch (k) {
    case 'cronograma': return x == null ? ['Escolha uma obra com blocos', '', 0] : [`${pct(x)}% concluído`, obraSel, 0];
    case 'estoque': return [`${reais(x.comprado)} comprados na obra`, x.falta == null ? '' : x.falta ? `${x.falta} itens ainda faltam comprar` : 'Tudo do previsto já comprado', 0];
    case 'material': return [`${reais(x.v)} a pagar`, `${x.n} ${x.n === 1 ? 'entrega' : 'entregas'} em aberto`, x.n];
    case 'retrabalhos': return [`${x.n} ${x.n === 1 ? 'pendência' : 'pendências'}`, x.inc ? `${x.inc} a completar` : 'Nenhuma a completar', x.inc];
    case 'vistoria': return [`${x.n} ${x.n === 1 ? 'vistoria guardada' : 'vistorias guardadas'}`, x.nc ? `${x.nc} itens não conformes` : '', 0];
    case 'entrega': return [`${x.n} ${x.n === 1 ? 'chave entregue' : 'chaves entregues'}`, x.ult ? 'Última em ' + fmtData(x.ult) : '', 0];
    case 'folha': return x ? [`Quinzena ${fmtData(x.q.data_inicio).slice(0, 5)} a ${fmtData(x.q.data_fim).slice(0, 5)}`, `${x.func} funcionários • ${reais(x.total)}`, 0] : ['Nenhuma quinzena ainda', '', 0];
    case 'prestacao': return [`Saldo ${reais(x.saldo)}`, x.sem ? `${x.sem} sem comprovante` : 'Todos com comprovante', 0];
  }
}
function desenha() {
  const n = numeros(), o = obras.find(x => x.nome === obraSel);
  $('obras').innerHTML = obras.map(x => { const p = pode('cronograma') ? andamento(x.nome) : null;
    return `<button class="obra" type="button" data-obra="${esc(x.nome)}" aria-pressed="${x.nome === obraSel}">${p != null ? `<span class="anel" style="--p:${p.toFixed(0)}"><span class="num">${p.toFixed(0)}%</span></span>` : ''}<span><b>${esc(x.nome)}</b><small>${x.blocos ? `${x.blocos} blocos • ${x.blocos * 4} aptos` : 'sem blocos cadastrados'}</small></span></button>`; }).join('');
  $('obras').hidden = !obras.length; $('kpis').classList.toggle('semobra', !obras.length);
  const k = [];
  if (pode('cronograma') && o) k.push(n.cronograma === undefined ? kpi('Andamento da obra', '…') : `<div class="kpi"><small>Andamento da obra</small><b class="num">${pct(n.cronograma ?? 0)}%</b><div class="bar"><span style="width:${n.cronograma ?? 0}%"></span></div></div>`);
  if (pode('material') && o) k.push(n.material ? kpi('Material a pagar', reais(n.material.v), `${n.material.n} ${n.material.n === 1 ? 'entrega' : 'entregas'}`, n.material.v > 0) : kpi('Material a pagar', '…'));
  if (pode('retrabalhos') && o) k.push(n.retrabalhos ? kpi('Pendências de retrabalho', n.retrabalhos.n, `${n.retrabalhos.inc} a completar`, n.retrabalhos.n > 0) : kpi('Pendências de retrabalho', '…'));
  if (pode('folha')) k.push(n.folha === undefined ? kpi('Folha da quinzena', '…') : n.folha ? kpi('Folha da quinzena', reais(n.folha.total), `${n.folha.func} funcionários • ${esc(n.folha.q.obra)}`) : kpi('Folha da quinzena', '—', 'nenhuma quinzena'));
  $('kpis').innerHTML = k.join(''); $('kpis').hidden = !k.length;
  $('etapas').innerHTML = Object.entries(ETAPAS).map(([e, ks], i) => { const l = ks.filter(pode); if (!l.length) return '';
    return `<section class="etapa"><h3><i>${i + 1}</i>${e}</h3>${l.map(m => { const [a, b, bd] = textos(m, n), esp = a === 'carregando…';
      return `<a class="card" href="${TMC.MODULOS[m].pagina}"><span class="ic">${svg(m)}</span><div><b>${esc(TMC.MODULOS[m].titulo)}</b><small class="${esp ? 'esperando' : ''}">${esc(a)}</small><small>${esc(b)}</small></div>${bd ? `<span class="bd num">${bd}</span>` : P[m] === 'ver' ? '<span class="nivel">só ver</span>' : ''}</a>`; }).join('')}</section>`; }).join('');
}
const kpi = (t, v, s = '', alerta = false) => v === '…' && falhou.size && [...falhou].some(m => t.toLowerCase().includes({ cronograma: 'andamento', material: 'material', retrabalhos: 'retrabalho', folha: 'folha' }[m])) ? kpi(t, '—', 'não carregou') : `<div class="kpi ${alerta ? 'alerta' : ''}"><small>${t}</small><b class="num">${v}</b><i>${s}</i></div>`;
// "Continuar de onde parou": vistoria em andamento guardada neste aparelho
function continuar() {
  if (!pode('vistoria')) return;
  let v; try { v = JSON.parse(localStorage.getItem('tmc_vist_rascunho')); } catch (e) {}
  if (!v || v.salvaId || !Object.keys(v.m || {}).length) return;
  const c = $('cont'); c.href = 'vistoria.html'; c.hidden = false;
  c.innerHTML = `${svg('vistoria')}<div><small>Continuar de onde parou</small><b>Vistoria • ${esc(v.obra || 'sem obra')} • ${esc(v.unid || '')}${v.cliente ? ' • ' + esc(v.cliente) : ''} (${Object.keys(v.m).length} de 42 itens)</b></div><span class="seta">Abrir →</span>`;
}
$('obras').onclick = e => { const b = e.target.closest('[data-obra]'); if (b) { obraSel = b.dataset.obra; mem.gravar('obra', obraSel); desenha(); } };

async function abrirPainel() {
  $('ola').innerHTML = `${ola()}, ${esc(P.nome)}<small>${new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })}</small>`;
  tela('painel'); desenha(); continuar();
  // obras (lista do cronograma), se o usuário tiver algum módulo que as use
  if (['cronograma', 'estoque', 'material', 'retrabalhos', 'vistoria', 'entrega'].some(pode)) {
    try { obras = ok(await sb.from('crono_obras').select('nome,blocos').order('nome')); } catch (e) { obras = []; }
    obraSel = obras.find(o => o.nome === mem.ler('obra'))?.nome || obras[0]?.nome || ''; desenha();
  }
  // cada módulo carrega em paralelo e o painel se atualiza quando chega
  mods.filter(m => LEITURAS[m]).forEach(m => LEITURAS[m]().then(r => { D[m] = r; desenha(); }, () => { falhou.add(m); desenha(); }));
}

async function rotear() {
  try {
    if (!(await TMC.sessao())) return tela('login');
    P = await TMC.perfil(); mods = TMC.modulos(P);
    if (!mods.length) return tela('semAcesso');
    if (mods.length === 1) return location.replace(TMC.MODULOS[mods[0]].pagina);
    abrirPainel();
  } catch (e) { tela('login'); $('erro').textContent = 'Erro: ' + msg(e); }
}
rotear();
</script>
